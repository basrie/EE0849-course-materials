<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280">
  <rect width="700" height="280" fill="#fafafa"/>

  <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Sources of Positioning Error</text>

  <!-- Central robot icon -->
  <g transform="translate(300, 100)">
    <rect x="35" y="60" width="30" height="40" fill="#64748b" stroke="#475569" stroke-width="2" rx="3"/>
    <line x1="50" y1="60" x2="50" y2="35" stroke="#64748b" stroke-width="6"/>
    <line x1="50" y1="35" x2="80" y2="15" stroke="#64748b" stroke-width="5"/>
    <line x1="80" y1="15" x2="100" y2="30" stroke="#64748b" stroke-width="4"/>
    <circle cx="100" cy="30" r="6" fill="#64748b"/>
  </g>

  <!-- Geometric Errors -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="120" height="70" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">Geometric</text>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3b82f6">• Link lengths</text>
    <text x="60" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3b82f6">• Joint offsets</text>
    <text x="60" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3b82f6">• Axis alignment</text>
  </g>
  <line x1="150" y1="95" x2="300" y2="130" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Gear Backlash -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="120" height="70" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#166534">Gear Backlash</text>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">• Play between teeth</text>
    <text x="60" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">• Direction dependent</text>
    <text x="60" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">• 0.5-2 arc-min</text>
  </g>
  <line x1="150" y1="185" x2="300" y2="150" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Compliance -->
  <g transform="translate(550, 60)">
    <rect x="0" y="0" width="120" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#92400e">Compliance</text>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#f59e0b">• Arm deflection</text>
    <text x="60" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#f59e0b">• Payload weight</text>
    <text x="60" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#f59e0b">• Process forces</text>
  </g>
  <line x1="550" y1="95" x2="410" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Thermal -->
  <g transform="translate(550, 150)">
    <rect x="0" y="0" width="120" height="70" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">Thermal</text>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ef4444">• Link expansion</text>
    <text x="60" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ef4444">• Motor heating</text>
    <text x="60" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ef4444">• Environment temp</text>
  </g>
  <line x1="550" y1="185" x2="410" y2="150" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Servo Errors (bottom) -->
  <g transform="translate(290, 210)">
    <rect x="0" y="0" width="120" height="55" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="60" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4338ca">Servo Errors</text>
    <text x="60" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6366f1">• Following error</text>
    <text x="60" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6366f1">• Settling time</text>
  </g>
  <line x1="350" y1="200" x2="350" y2="210" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,2"/>
</svg>
