<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <rect width="600" height="300" fill="#fafafa"/>

  <text x="300" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">FANUC World Zones</text>

  <!-- Top view of workspace -->
  <g transform="translate(50, 50)">
    <!-- Workspace circle -->
    <circle cx="200" cy="120" r="150" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Workspace Envelope</text>

    <!-- Robot base -->
    <rect x="185" y="105" width="30" height="30" fill="#64748b" stroke="#475569" stroke-width="2" rx="3"/>
    <text x="200" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#475569">Base</text>

    <!-- Safe zone (green area where robot CAN operate) -->
    <path d="M 200 120 L 100 50 A 150 150 0 0 1 300 50 Z" fill="#dcfce7" fill-opacity="0.5" stroke="#22c55e" stroke-width="2"/>
    <text x="200" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#166534">Safe Zone</text>
    <text x="200" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">(Must stay inside)</text>

    <!-- Forbidden zone 1 (fixture) -->
    <rect x="280" y="140" width="60" height="50" fill="#fee2e2" fill-opacity="0.7" stroke="#ef4444" stroke-width="2"/>
    <text x="310" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#991b1b">Forbidden</text>
    <text x="310" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ef4444">Fixture</text>

    <!-- Forbidden zone 2 (operator area) -->
    <rect x="70" y="160" width="70" height="60" fill="#fee2e2" fill-opacity="0.7" stroke="#ef4444" stroke-width="2"/>
    <text x="105" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#991b1b">Forbidden</text>
    <text x="105" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ef4444">Operator Area</text>
  </g>

  <!-- Legend -->
  <g transform="translate(430, 60)">
    <rect x="0" y="0" width="150" height="180" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="75" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Zone Types</text>

    <rect x="15" y="40" width="20" height="15" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
    <text x="45" y="52" font-family="Arial, sans-serif" font-size="9" fill="#333">Safe Zone</text>
    <text x="45" y="63" font-family="Arial, sans-serif" font-size="8" fill="#666">Robot must stay inside</text>

    <rect x="15" y="80" width="20" height="15" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="45" y="92" font-family="Arial, sans-serif" font-size="9" fill="#333">Forbidden Zone</text>
    <text x="45" y="103" font-family="Arial, sans-serif" font-size="8" fill="#666">Robot cannot enter</text>

    <circle cx="25" cy="130" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="45" y="133" font-family="Arial, sans-serif" font-size="9" fill="#333">Workspace Limit</text>
    <text x="45" y="144" font-family="Arial, sans-serif" font-size="8" fill="#666">Physical reach limit</text>

    <text x="75" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Violation → Stop + Signal</text>
  </g>
</svg>
