<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420">
  <rect width="400" height="420" fill="#fafafa"/>

  <text x="200" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Lab 6: Pick and Place Program Flow</text>

  <!-- Start -->
  <ellipse cx="200" cy="55" rx="50" ry="20" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">START</text>

  <!-- Arrow -->
  <line x1="200" y1="75" x2="200" y2="95" stroke="#333" stroke-width="2"/>
  <polygon points="200,100 195,92 205,92" fill="#333"/>

  <!-- Initialize -->
  <rect x="125" y="100" width="150" height="35" rx="5" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
  <text x="200" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Initialize: Gripper OFF</text>

  <!-- Arrow -->
  <line x1="200" y1="135" x2="200" y2="155" stroke="#333" stroke-width="2"/>
  <polygon points="200,160 195,152 205,152" fill="#333"/>

  <!-- Move to Home -->
  <rect x="125" y="160" width="150" height="35" rx="5" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  <text x="200" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">J P[1:Home] 100% FINE</text>

  <!-- Arrow -->
  <line x1="200" y1="195" x2="200" y2="215" stroke="#333" stroke-width="2"/>
  <polygon points="200,220 195,212 205,212" fill="#333"/>

  <!-- Loop label -->
  <text x="320" y="235" font-family="Arial, sans-serif" font-size="9" fill="#f97316">LOOP</text>
  <path d="M 310 240 L 310 380 L 200 380" stroke="#f97316" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>

  <!-- Move to Pick Approach -->
  <rect x="125" y="220" width="150" height="35" rx="5" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  <text x="200" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">L P[2:Pick_App] FINE</text>

  <!-- Arrow -->
  <line x1="200" y1="255" x2="200" y2="265" stroke="#333" stroke-width="2"/>
  <polygon points="200,270 195,262 205,262" fill="#333"/>

  <!-- Pick and Grip -->
  <rect x="100" y="270" width="200" height="45" rx="5" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
  <text x="200" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">L P[3:Pick] → Gripper ON</text>
  <text x="200" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffedd5">WAIT 0.5sec</text>

  <!-- Arrow -->
  <line x1="200" y1="315" x2="200" y2="325" stroke="#333" stroke-width="2"/>
  <polygon points="200,330 195,322 205,322" fill="#333"/>

  <!-- Place and Release -->
  <rect x="100" y="330" width="200" height="45" rx="5" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="200" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">L P[5:Place] → Gripper OFF</text>
  <text x="200" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ede9fe">WAIT 0.3sec</text>

  <!-- Arrow back to loop -->
  <line x1="200" y1="375" x2="200" y2="385" stroke="#333" stroke-width="2"/>
  <polygon points="200,220 195,228 205,228" fill="#f97316" transform="translate(0, 165)"/>

  <!-- Legend -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="12" height="12" fill="#64748b"/>
    <text x="18" y="10" font-family="Arial, sans-serif" font-size="8" fill="#333">Motion</text>

    <rect x="0" y="18" width="12" height="12" fill="#f97316"/>
    <text x="18" y="28" font-family="Arial, sans-serif" font-size="8" fill="#333">Pick</text>

    <rect x="0" y="36" width="12" height="12" fill="#8b5cf6"/>
    <text x="18" y="46" font-family="Arial, sans-serif" font-size="8" fill="#333">Place</text>
  </g>

  <text x="200" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Program loops continuously until stopped</text>
</svg>
