<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280">
  <rect width="450" height="280" fill="#fafafa"/>

  <text x="225" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Digital Input Types: NPN vs PNP</text>

  <!-- NPN (Sinking) -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="180" height="200" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">NPN (Sinking)</text>

    <!-- Circuit -->
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="10" fill="#333">+24V</text>
    <line x1="45" y1="50" x2="90" y2="50" stroke="#ef4444" stroke-width="2"/>

    <!-- Load -->
    <rect x="70" y="65" width="40" height="25" fill="#f97316" stroke="#ea580c"/>
    <text x="90" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Load</text>
    <line x1="90" y1="50" x2="90" y2="65" stroke="#333" stroke-width="1.5"/>
    <line x1="90" y1="90" x2="90" y2="110" stroke="#333" stroke-width="1.5"/>

    <!-- Sensor (transistor) -->
    <circle cx="90" cy="125" r="15" fill="white" stroke="#333" stroke-width="1.5"/>
    <text x="90" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">NPN</text>
    <line x1="90" y1="140" x2="90" y2="160" stroke="#333" stroke-width="1.5"/>

    <!-- Ground -->
    <line x1="70" y1="160" x2="110" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="75" y1="165" x2="105" y2="165" stroke="#333" stroke-width="1.5"/>
    <line x1="80" y1="170" x2="100" y2="170" stroke="#333" stroke-width="1"/>
    <text x="90" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">GND (0V)</text>

    <!-- Arrow showing current flow -->
    <path d="M 115 80 L 115 140 L 125 130" stroke="#22c55e" stroke-width="2" fill="none"/>
    <text x="140" y="115" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">Current</text>
    <text x="140" y="125" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">sinks to</text>
    <text x="140" y="135" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">ground</text>
  </g>

  <!-- PNP (Sourcing) -->
  <g transform="translate(240, 50)">
    <rect x="0" y="0" width="180" height="200" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">PNP (Sourcing)</text>

    <!-- Circuit -->
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="10" fill="#333">+24V</text>
    <line x1="45" y1="50" x2="90" y2="50" stroke="#ef4444" stroke-width="2"/>
    <line x1="90" y1="50" x2="90" y2="65" stroke="#333" stroke-width="1.5"/>

    <!-- Sensor (transistor) -->
    <circle cx="90" cy="80" r="15" fill="white" stroke="#333" stroke-width="1.5"/>
    <text x="90" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">PNP</text>
    <line x1="90" y1="95" x2="90" y2="115" stroke="#333" stroke-width="1.5"/>

    <!-- Load -->
    <rect x="70" y="115" width="40" height="25" fill="#f97316" stroke="#ea580c"/>
    <text x="90" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Load</text>
    <line x1="90" y1="140" x2="90" y2="160" stroke="#333" stroke-width="1.5"/>

    <!-- Ground -->
    <line x1="70" y1="160" x2="110" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="75" y1="165" x2="105" y2="165" stroke="#333" stroke-width="1.5"/>
    <line x1="80" y1="170" x2="100" y2="170" stroke="#333" stroke-width="1"/>
    <text x="90" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">GND (0V)</text>

    <!-- Arrow showing current flow -->
    <path d="M 115 75 L 115 130 L 125 120" stroke="#22c55e" stroke-width="2" fill="none"/>
    <text x="140" y="95" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">Current</text>
    <text x="140" y="105" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">sourced</text>
    <text x="140" y="115" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">from +V</text>
  </g>

  <!-- Note -->
  <text x="225" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">PNP is more common in Europe/Asia, NPN in North America</text>
</svg>
