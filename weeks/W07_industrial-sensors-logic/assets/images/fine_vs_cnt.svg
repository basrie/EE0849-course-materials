<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <rect width="600" height="200" fill="#fafafa"/>

  <text x="300" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Motion Termination: FINE vs CNT</text>

  <!-- FINE motion -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="250" height="140" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="125" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">FINE (Stop at point)</text>

    <!-- Path with stops -->
    <circle cx="40" cy="70" r="8" fill="#22c55e"/>
    <text x="40" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">P1</text>

    <line x1="48" y1="70" x2="105" y2="70" stroke="#3b82f6" stroke-width="2"/>

    <circle cx="115" cy="70" r="8" fill="#f97316"/>
    <text x="115" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">P2</text>
    <text x="115" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ef4444">STOP</text>

    <line x1="125" y1="70" x2="182" y2="70" stroke="#3b82f6" stroke-width="2"/>

    <circle cx="192" cy="70" r="8" fill="#ef4444"/>
    <text x="192" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">P3</text>

    <!-- Velocity profile -->
    <g transform="translate(40, 105)">
      <line x1="0" y1="25" x2="170" y2="25" stroke="#666" stroke-width="1"/>
      <text x="-10" y="28" font-family="Arial, sans-serif" font-size="7" fill="#666">v</text>
      <path d="M 0 25 L 20 5 L 40 5 L 60 25 L 80 25 L 100 5 L 120 5 L 140 25" stroke="#ef4444" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- CNT motion -->
  <g transform="translate(320, 45)">
    <rect x="0" y="0" width="250" height="140" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="125" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">CNT (Continuous blend)</text>

    <!-- Path with blend -->
    <circle cx="40" cy="70" r="8" fill="#22c55e"/>
    <text x="40" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">P1</text>

    <!-- Blended path -->
    <line x1="48" y1="70" x2="90" y2="70" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 90 70 Q 115 70 125 60 Q 135 50 145 60" stroke="#22c55e" stroke-width="2.5" fill="none"/>
    <line x1="145" y1="60" x2="182" y2="60" stroke="#3b82f6" stroke-width="2"/>

    <!-- Original via point (not reached) -->
    <circle cx="115" cy="70" r="5" fill="#f97316" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
    <text x="115" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#f97316">P2</text>

    <circle cx="192" cy="60" r="8" fill="#ef4444"/>
    <text x="192" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">P3</text>

    <!-- Blend zone -->
    <ellipse cx="115" cy="65" rx="30" ry="15" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Velocity profile -->
    <g transform="translate(40, 105)">
      <line x1="0" y1="25" x2="170" y2="25" stroke="#666" stroke-width="1"/>
      <text x="-10" y="28" font-family="Arial, sans-serif" font-size="7" fill="#666">v</text>
      <path d="M 0 25 L 20 5 L 120 5 L 140 25" stroke="#22c55e" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Comparison -->
  <text x="155" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#991b1b">Accurate but slower</text>
  <text x="445" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#166534">Faster but may miss point</text>
</svg>
