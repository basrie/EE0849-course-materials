<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300">
  <rect width="450" height="300" fill="#fafafa"/>

  <text x="225" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Proximity Sensors</text>

  <!-- Inductive -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="195" height="230" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="97" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Inductive Proximity</text>

    <!-- Sensor body -->
    <rect x="70" y="50" width="55" height="70" rx="5" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="97" cy="55" rx="22" ry="8" fill="#3b82f6"/>
    <text x="97" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Coil</text>

    <!-- EM field lines -->
    <path d="M 75 45 Q 60 35 75 25" stroke="#3b82f6" stroke-width="1" fill="none" stroke-dasharray="3,2"/>
    <path d="M 97 42 Q 97 28 97 20" stroke="#3b82f6" stroke-width="1" fill="none" stroke-dasharray="3,2"/>
    <path d="M 119 45 Q 134 35 119 25" stroke="#3b82f6" stroke-width="1" fill="none" stroke-dasharray="3,2"/>

    <!-- Metal target -->
    <rect x="80" y="135" width="35" height="15" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
    <text x="97" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Metal target</text>

    <!-- Range indicator -->
    <line x1="130" y1="55" x2="130" y2="140" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="145" y="95" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">1-30mm</text>

    <!-- Properties -->
    <text x="97" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Detects: Metal only</text>
    <text x="97" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Non-contact</text>
    <text x="97" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#22c55e">Fast response &lt;1ms</text>
  </g>

  <!-- Capacitive -->
  <g transform="translate(235, 45)">
    <rect x="0" y="0" width="195" height="230" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="97" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Capacitive Proximity</text>

    <!-- Sensor body -->
    <rect x="70" y="50" width="55" height="70" rx="5" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <rect x="82" y="55" width="30" height="15" fill="#22c55e"/>
    <text x="97" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Plate</text>

    <!-- Electric field lines -->
    <path d="M 80 45 Q 70 30 85 20" stroke="#22c55e" stroke-width="1" fill="none" stroke-dasharray="3,2"/>
    <path d="M 97 45 Q 97 30 97 18" stroke="#22c55e" stroke-width="1" fill="none" stroke-dasharray="3,2"/>
    <path d="M 114 45 Q 124 30 109 20" stroke="#22c55e" stroke-width="1" fill="none" stroke-dasharray="3,2"/>

    <!-- Non-metal target -->
    <ellipse cx="97" cy="142" rx="20" ry="12" fill="#fbbf24" stroke="#f59e0b" stroke-width="1"/>
    <text x="97" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Any material</text>

    <!-- Range indicator -->
    <line x1="130" y1="55" x2="130" y2="135" stroke="#f97316" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="145" y="95" font-family="Arial, sans-serif" font-size="8" fill="#f97316">1-25mm</text>

    <!-- Properties -->
    <text x="97" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Detects: Any material</text>
    <text x="97" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Liquids, plastics, wood</text>
    <text x="97" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Level sensing</text>
  </g>

  <!-- Note -->
  <text x="225" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Proximity sensors detect objects without physical contact</text>
</svg>
