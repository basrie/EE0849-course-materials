<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220">
  <rect width="500" height="220" fill="#fafafa"/>

  <text x="250" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Digital Output Types</text>

  <!-- Relay -->
  <g transform="translate(20, 45)">
    <rect x="0" y="0" width="140" height="150" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Relay Output</text>

    <!-- Coil symbol -->
    <rect x="50" y="40" width="40" height="20" fill="none" stroke="#333" stroke-width="1.5"/>
    <text x="70" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">Coil</text>

    <!-- Contact symbol -->
    <line x1="50" y1="80" x2="65" y2="80" stroke="#333" stroke-width="2"/>
    <line x1="65" y1="80" x2="80" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="80" x2="90" y2="80" stroke="#333" stroke-width="2"/>
    <circle cx="65" cy="80" r="2" fill="#333"/>
    <circle cx="80" cy="80" r="2" fill="#333"/>

    <text x="70" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Mechanical switch</text>
    <text x="70" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Isolated contacts</text>
    <text x="70" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">AC or DC loads</text>
    <text x="70" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ef4444">Slow (5-15ms)</text>
  </g>

  <!-- Transistor -->
  <g transform="translate(180, 45)">
    <rect x="0" y="0" width="140" height="150" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Transistor Output</text>

    <!-- Transistor symbol -->
    <circle cx="70" cy="55" r="18" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="55" y1="55" x2="62" y2="55" stroke="#333" stroke-width="1.5"/>
    <line x1="62" y1="45" x2="62" y2="65" stroke="#333" stroke-width="1.5"/>
    <line x1="62" y1="50" x2="78" y2="42" stroke="#333" stroke-width="1.5"/>
    <line x1="62" y1="60" x2="78" y2="68" stroke="#333" stroke-width="1.5"/>

    <text x="70" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Solid-state</text>
    <text x="70" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">DC loads only</text>
    <text x="70" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">High frequency OK</text>
    <text x="70" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#22c55e">Fast (&lt;1ms)</text>
  </g>

  <!-- Triac -->
  <g transform="translate(340, 45)">
    <rect x="0" y="0" width="140" height="150" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Triac Output</text>

    <!-- Triac symbol (simplified) -->
    <polygon points="55,45 85,55 55,65" fill="none" stroke="#333" stroke-width="1.5"/>
    <polygon points="85,45 55,55 85,65" fill="none" stroke="#333" stroke-width="1.5"/>
    <line x1="70" y1="45" x2="70" y2="35" stroke="#333" stroke-width="1.5"/>
    <line x1="70" y1="65" x2="70" y2="75" stroke="#333" stroke-width="1.5"/>

    <text x="70" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Solid-state</text>
    <text x="70" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">AC loads only</text>
    <text x="70" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">No mechanical wear</text>
    <text x="70" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#22c55e">Fast</text>
  </g>

  <!-- Note -->
  <text x="250" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Choose based on: load type (AC/DC), switching speed, isolation requirements</text>
</svg>
