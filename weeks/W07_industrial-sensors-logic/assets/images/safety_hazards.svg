<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280">
  <rect width="450" height="280" fill="#fafafa"/>

  <text x="225" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Industrial Robot Hazards</text>

  <!-- Impact -->
  <g transform="translate(25, 50)">
    <rect x="0" y="0" width="95" height="100" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="47" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">IMPACT</text>

    <!-- Robot arm hitting person icon -->
    <line x1="25" y1="45" x2="70" y2="55" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="55" x2="80" y2="70" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="85" cy="50" r="8" fill="#f97316"/>
    <text x="47" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Collision with</text>
    <text x="47" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">robot arm</text>
  </g>

  <!-- Crushing -->
  <g transform="translate(130, 50)">
    <rect x="0" y="0" width="95" height="100" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="47" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">CRUSHING</text>

    <!-- Pinch point icon -->
    <rect x="20" y="40" width="25" height="35" fill="#64748b"/>
    <rect x="50" y="40" width="25" height="35" fill="#64748b"/>
    <circle cx="47" cy="57" r="6" fill="#f97316"/>
    <path d="M 45 55 L 38 55 M 49 55 L 56 55" stroke="#ef4444" stroke-width="2"/>
    <text x="47" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Pinch points</text>
    <text x="47" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">between parts</text>
  </g>

  <!-- Entanglement -->
  <g transform="translate(235, 50)">
    <rect x="0" y="0" width="95" height="100" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="47" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">ENTANGLE</text>

    <!-- Rotating part with entanglement -->
    <circle cx="47" cy="55" r="18" fill="none" stroke="#64748b" stroke-width="3"/>
    <line x1="47" y1="37" x2="47" y2="50" stroke="#64748b" stroke-width="2"/>
    <path d="M 65 55 Q 75 55 78 48 Q 80 42 75 40" stroke="#f97316" stroke-width="2" fill="none"/>
    <text x="47" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Rotating parts</text>
    <text x="47" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">catch clothing</text>
  </g>

  <!-- Ejection -->
  <g transform="translate(330, 50)">
    <rect x="0" y="0" width="95" height="100" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="47" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">EJECTION</text>

    <!-- Gripper dropping part -->
    <rect x="30" y="35" width="35" height="15" fill="#64748b"/>
    <rect x="35" y="50" width="10" height="8" fill="#64748b"/>
    <rect x="50" y="50" width="10" height="8" fill="#64748b"/>
    <rect x="40" y="65" width="15" height="10" fill="#f97316"/>
    <path d="M 47 75 L 47 85" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="47" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Dropped or</text>
    <text x="47" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">thrown parts</text>
  </g>

  <!-- Safety Standards Box -->
  <rect x="25" y="165" width="400" height="95" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="225" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Safety Standards</text>

  <g transform="translate(45, 200)">
    <rect x="0" y="0" width="110" height="45" rx="4" fill="#e0e7ff"/>
    <text x="55" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#4338ca">ISO 10218</text>
    <text x="55" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4338ca">Robot Safety</text>
    <text x="55" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4338ca">(International)</text>
  </g>

  <g transform="translate(170, 200)">
    <rect x="0" y="0" width="110" height="45" rx="4" fill="#e0e7ff"/>
    <text x="55" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#4338ca">ANSI/RIA 15.06</text>
    <text x="55" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4338ca">Robot Safety</text>
    <text x="55" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4338ca">(United States)</text>
  </g>

  <g transform="translate(295, 200)">
    <rect x="0" y="0" width="110" height="45" rx="4" fill="#e0e7ff"/>
    <text x="55" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#4338ca">EN ISO 13849</text>
    <text x="55" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4338ca">Safety Functions</text>
    <text x="55" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4338ca">(Performance Level)</text>
  </g>

  <text x="225" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">Safety is NOT optional - it's the law and saves lives</text>
</svg>
