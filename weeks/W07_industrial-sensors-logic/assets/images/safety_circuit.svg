<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280">
  <rect width="600" height="280" fill="#fafafa"/>

  <text x="300" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Safety Circuit Architecture (Series Connection)</text>

  <!-- Power supply -->
  <rect x="30" y="100" width="60" height="50" rx="5" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">24V</text>
  <text x="60" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Supply</text>

  <!-- E-Stop 1 -->
  <g transform="translate(120, 95)">
    <circle cx="30" cy="30" r="25" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
    <circle cx="30" cy="30" r="15" fill="#fca5a5"/>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#7f1d1d">E-STOP</text>
    <text x="30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">NC Contact</text>
  </g>

  <!-- Light Curtain -->
  <g transform="translate(210, 95)">
    <rect x="5" y="5" width="50" height="50" rx="3" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <line x1="15" y1="15" x2="15" y2="45" stroke="#fbbf24" stroke-width="2"/>
    <line x1="25" y1="15" x2="25" y2="45" stroke="#fbbf24" stroke-width="2"/>
    <line x1="35" y1="15" x2="35" y2="45" stroke="#fbbf24" stroke-width="2"/>
    <line x1="45" y1="15" x2="45" y2="45" stroke="#fbbf24" stroke-width="2"/>
    <text x="30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Light Curtain</text>
  </g>

  <!-- Safety Mat -->
  <g transform="translate(300, 95)">
    <rect x="5" y="20" width="50" height="35" rx="2" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
    <line x1="10" y1="30" x2="50" y2="30" stroke="#f59e0b" stroke-width="1"/>
    <line x1="10" y1="40" x2="50" y2="40" stroke="#f59e0b" stroke-width="1"/>
    <text x="30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Safety Mat</text>
  </g>

  <!-- Safety Relay -->
  <g transform="translate(390, 90)">
    <rect x="0" y="0" width="70" height="70" rx="5" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <text x="35" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Safety</text>
    <text x="35" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Relay</text>
    <text x="35" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Dual-channel</text>
  </g>

  <!-- Robot Controller -->
  <g transform="translate(500, 90)">
    <rect x="0" y="0" width="70" height="70" rx="5" fill="#64748b" stroke="#475569" stroke-width="2"/>
    <text x="35" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Robot</text>
    <text x="35" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Controller</text>
    <text x="35" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Motor Power</text>
  </g>

  <!-- Connections (series circuit) -->
  <line x1="90" y1="125" x2="120" y2="125" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="125" x2="210" y2="125" stroke="#333" stroke-width="2"/>
  <line x1="265" y1="125" x2="300" y2="125" stroke="#333" stroke-width="2"/>
  <line x1="360" y1="125" x2="390" y2="125" stroke="#333" stroke-width="2"/>
  <line x1="460" y1="125" x2="500" y2="125" stroke="#333" stroke-width="2"/>

  <!-- Fail-safe principle box -->
  <rect x="100" y="195" width="400" height="70" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="300" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">Fail-Safe Design Principle</text>
  <text x="300" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">All safety devices use Normally Closed (NC) contacts in SERIES</text>
  <text x="300" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">ANY device opens = circuit breaks = robot STOPS</text>

  <!-- Labels above circuit -->
  <text x="300" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">All devices must be closed for robot to operate</text>
</svg>
