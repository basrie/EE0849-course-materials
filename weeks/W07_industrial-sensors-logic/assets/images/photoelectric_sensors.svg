<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <rect width="500" height="320" fill="#fafafa"/>

  <text x="250" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Photoelectric Sensors</text>

  <!-- Through-Beam -->
  <g transform="translate(15, 45)">
    <rect x="0" y="0" width="145" height="125" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="72" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#991b1b">Through-Beam</text>

    <!-- Emitter -->
    <rect x="15" y="50" width="30" height="40" rx="3" fill="#3b82f6"/>
    <text x="30" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">TX</text>

    <!-- Receiver -->
    <rect x="100" y="50" width="30" height="40" rx="3" fill="#22c55e"/>
    <text x="115" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white">RX</text>

    <!-- Light beam -->
    <line x1="45" y1="70" x2="100" y2="70" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8,4"/>

    <text x="72" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Range: up to 30m</text>
    <text x="72" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Most reliable</text>
  </g>

  <!-- Retro-Reflective -->
  <g transform="translate(178, 45)">
    <rect x="0" y="0" width="145" height="125" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="72" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">Retro-Reflective</text>

    <!-- Sensor unit -->
    <rect x="15" y="50" width="35" height="40" rx="3" fill="#6366f1"/>
    <text x="32" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">TX</text>
    <text x="32" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">RX</text>

    <!-- Reflector -->
    <rect x="105" y="50" width="25" height="40" rx="2" fill="#94a3b8" stroke="#64748b"/>
    <line x1="108" y1="55" x2="127" y2="55" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="108" y1="62" x2="127" y2="62" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="108" y1="69" x2="127" y2="69" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="108" y1="76" x2="127" y2="76" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="108" y1="83" x2="127" y2="83" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Light beams -->
    <line x1="50" y1="63" x2="105" y2="63" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3"/>
    <line x1="105" y1="77" x2="50" y2="77" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,3"/>

    <text x="72" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Range: 3-10m</text>
    <text x="72" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">One-side wiring</text>
  </g>

  <!-- Diffuse -->
  <g transform="translate(340, 45)">
    <rect x="0" y="0" width="145" height="125" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="72" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#166534">Diffuse (Proximity)</text>

    <!-- Sensor unit -->
    <rect x="15" y="50" width="35" height="40" rx="3" fill="#22c55e"/>
    <text x="32" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">TX</text>
    <text x="32" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">RX</text>

    <!-- Target object -->
    <rect x="100" y="55" width="30" height="30" rx="3" fill="#f97316"/>

    <!-- Light beams (scattered) -->
    <line x1="50" y1="63" x2="100" y2="65" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,3"/>
    <line x1="100" y1="70" x2="50" y2="77" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="100" y1="75" x2="60" y2="82" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

    <text x="72" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Range: 10-500mm</text>
    <text x="72" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Simplest setup</text>
  </g>

  <!-- Comparison diagram -->
  <g transform="translate(25, 185)">
    <rect x="0" y="0" width="450" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="225" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Detection Principle</text>

    <!-- Through-beam detection -->
    <g transform="translate(30, 35)">
      <rect x="0" y="10" width="20" height="25" fill="#3b82f6"/>
      <rect x="100" y="10" width="20" height="25" fill="#22c55e"/>
      <line x1="20" y1="22" x2="100" y2="22" stroke="#fbbf24" stroke-width="2"/>
      <rect x="50" y="5" width="20" height="35" fill="#64748b" opacity="0.8"/>
      <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">Beam broken</text>
      <text x="60" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ef4444">= Object detected</text>
    </g>

    <!-- Retro detection -->
    <g transform="translate(175, 35)">
      <rect x="0" y="10" width="25" height="25" fill="#6366f1"/>
      <rect x="100" y="10" width="15" height="25" fill="#94a3b8"/>
      <path d="M 25 18 L 100 18 M 100 27 L 25 27" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,2"/>
      <rect x="50" y="5" width="20" height="35" fill="#64748b" opacity="0.8"/>
      <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">No reflection</text>
      <text x="60" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ef4444">= Object detected</text>
    </g>

    <!-- Diffuse detection -->
    <g transform="translate(320, 35)">
      <rect x="0" y="10" width="25" height="25" fill="#22c55e"/>
      <rect x="80" y="8" width="25" height="30" fill="#f97316"/>
      <path d="M 25 18 L 80 20" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,2"/>
      <path d="M 80 25 L 25 28" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="55" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">Light reflected</text>
      <text x="55" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">= Object detected</text>
    </g>
  </g>

  <text x="250" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Choose based on: range, environment, mounting constraints</text>
</svg>
