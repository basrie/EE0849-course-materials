<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fafafa"/>

  <text x="160" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Gear Backlash</text>

  <!-- Gear 1 (driving) -->
  <g transform="translate(90, 110)">
    <circle cx="0" cy="0" r="45" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
    <!-- Teeth representation -->
    <rect x="-6" y="-50" width="12" height="10" fill="#3b82f6" rx="1"/>
    <rect x="30" y="-35" width="10" height="12" fill="#3b82f6" rx="1" transform="rotate(45)"/>
    <rect x="42" y="-6" width="10" height="12" fill="#3b82f6" rx="1"/>
    <rect x="30" y="25" width="10" height="12" fill="#3b82f6" rx="1" transform="rotate(-45)"/>
    <rect x="-6" y="40" width="12" height="10" fill="#3b82f6" rx="1"/>
    <rect x="-40" y="25" width="10" height="12" fill="#3b82f6" rx="1" transform="rotate(45)"/>
    <rect x="-52" y="-6" width="10" height="12" fill="#3b82f6" rx="1"/>
    <rect x="-40" y="-35" width="10" height="12" fill="#3b82f6" rx="1" transform="rotate(-45)"/>
    <!-- Direction arrow -->
    <path d="M -25 -60 A 35 35 0 0 1 25 -60" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="25,-60 18,-55 20,-65" fill="#3b82f6"/>
  </g>

  <!-- Gear 2 (driven) -->
  <g transform="translate(200, 110)">
    <circle cx="0" cy="0" r="35" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#22c55e"/>
    <!-- Teeth representation -->
    <rect x="-5" y="-40" width="10" height="8" fill="#22c55e" rx="1"/>
    <rect x="25" y="-25" width="8" height="10" fill="#22c55e" rx="1" transform="rotate(45)"/>
    <rect x="32" y="-5" width="8" height="10" fill="#22c55e" rx="1"/>
    <rect x="25" y="18" width="8" height="10" fill="#22c55e" rx="1" transform="rotate(-45)"/>
    <rect x="-5" y="32" width="10" height="8" fill="#22c55e" rx="1"/>
    <rect x="-33" y="18" width="8" height="10" fill="#22c55e" rx="1" transform="rotate(45)"/>
    <rect x="-40" y="-5" width="8" height="10" fill="#22c55e" rx="1"/>
    <rect x="-33" y="-25" width="8" height="10" fill="#22c55e" rx="1" transform="rotate(-45)"/>
  </g>

  <!-- Backlash gap indication -->
  <g transform="translate(143, 95)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#ef4444" stroke-width="2"/>
    <line x1="0" y1="0" x2="5" y2="-5" stroke="#ef4444" stroke-width="2"/>
    <line x1="0" y1="0" x2="5" y2="5" stroke="#ef4444" stroke-width="2"/>
    <line x1="20" y1="0" x2="15" y2="-5" stroke="#ef4444" stroke-width="2"/>
    <line x1="20" y1="0" x2="15" y2="5" stroke="#ef4444" stroke-width="2"/>
  </g>
  <text x="153" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ef4444">Gap</text>

  <!-- Labels -->
  <text x="90" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">Motor Gear</text>
  <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">Output Gear</text>

  <!-- Explanation -->
  <rect x="40" y="190" width="240" height="40" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="160" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#991b1b">When direction reverses, gear must</text>
  <text x="160" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#991b1b">travel through gap before engaging</text>
</svg>
