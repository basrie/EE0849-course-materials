<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250">
  <rect width="700" height="250" fill="#fafafa"/>

  <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Calibration Methods</text>

  <!-- Mastering -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="190" height="170" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="95" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Mastering</text>
    <text x="95" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">(Joint Zero Calibration)</text>

    <!-- Joint illustration -->
    <circle cx="95" cy="85" r="25" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>
    <line x1="95" y1="85" x2="95" y2="60" stroke="#1e40af" stroke-width="3"/>
    <line x1="95" y1="85" x2="115" y2="95" stroke="#1e40af" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="95" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e40af">0°</text>

    <text x="95" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Define joint zero positions</text>
    <text x="95" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• After motor replacement</text>
    <text x="95" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• After collision</text>
  </g>

  <!-- TCP Calibration -->
  <g transform="translate(250, 55)">
    <rect x="0" y="0" width="190" height="170" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="95" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">TCP Calibration</text>
    <text x="95" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">(4-Point Method)</text>

    <!-- TCP illustration -->
    <circle cx="95" cy="80" r="5" fill="#ef4444"/>
    <line x1="70" y1="95" x2="95" y2="80" stroke="#166534" stroke-width="2"/>
    <line x1="120" y1="95" x2="95" y2="80" stroke="#166534" stroke-width="2"/>
    <line x1="80" y1="70" x2="95" y2="80" stroke="#166534" stroke-width="2"/>
    <line x1="110" y1="65" x2="95" y2="80" stroke="#166534" stroke-width="2"/>
    <circle cx="70" cy="95" r="3" fill="#22c55e"/>
    <circle cx="120" cy="95" r="3" fill="#22c55e"/>
    <circle cx="80" cy="70" r="3" fill="#22c55e"/>
    <circle cx="110" cy="65" r="3" fill="#22c55e"/>

    <text x="95" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Find tool center point offset</text>
    <text x="95" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• Touch point from 4+ angles</text>
    <text x="95" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• System calculates offset</text>
  </g>

  <!-- Full Kinematic Calibration -->
  <g transform="translate(470, 55)">
    <rect x="0" y="0" width="190" height="170" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="95" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Full Calibration</text>
    <text x="95" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">(External Measurement)</text>

    <!-- Laser tracker illustration -->
    <rect x="40" y="65" width="30" height="40" fill="#fcd34d" stroke="#f59e0b" stroke-width="1.5" rx="2"/>
    <line x1="70" y1="85" x2="130" y2="75" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="130" cy="75" r="8" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
    <text x="40" y="115" font-family="Arial, sans-serif" font-size="8" fill="#92400e">Laser Tracker</text>
    <text x="130" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#92400e">Target</text>

    <text x="95" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Measure all parameters</text>
    <text x="95" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• 50-100+ measurement points</text>
    <text x="95" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">• Sub-mm accuracy possible</text>
  </g>

  <!-- Accuracy improvement arrow -->
  <line x1="100" y1="235" x2="600" y2="235" stroke="#666" stroke-width="1.5"/>
  <polygon points="600,235 590,230 590,240" fill="#666"/>
  <text x="350" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Increasing accuracy / complexity / cost</text>
</svg>
