<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240">
  <rect width="320" height="240" fill="#fafafa"/>

  <text x="160" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Arm Deflection Under Load</text>

  <!-- Base -->
  <rect x="40" y="160" width="40" height="50" fill="#64748b" stroke="#475569" stroke-width="2" rx="3"/>
  <rect x="30" y="200" width="60" height="15" fill="#94a3b8"/>

  <!-- Ideal arm (dashed) -->
  <line x1="60" y1="160" x2="60" y2="100" stroke="#22c55e" stroke-width="4" stroke-dasharray="6,3"/>
  <line x1="60" y1="100" x2="200" y2="100" stroke="#22c55e" stroke-width="3" stroke-dasharray="6,3"/>
  <circle cx="200" cy="100" r="8" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Deflected arm (solid) -->
  <line x1="60" y1="160" x2="60" y2="100" stroke="#3b82f6" stroke-width="4"/>
  <path d="M 60 100 Q 130 105 200 130" stroke="#3b82f6" stroke-width="3" fill="none"/>
  <circle cx="200" cy="130" r="8" fill="#3b82f6"/>

  <!-- Weight/Load -->
  <line x1="200" y1="138" x2="200" y2="175" stroke="#ef4444" stroke-width="2"/>
  <polygon points="200,180 195,170 205,170" fill="#ef4444"/>
  <text x="215" y="165" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">F</text>

  <!-- Deflection annotation -->
  <line x1="210" y1="100" x2="210" y2="130" stroke="#f97316" stroke-width="1.5"/>
  <line x1="205" y1="100" x2="215" y2="100" stroke="#f97316" stroke-width="1.5"/>
  <line x1="205" y1="130" x2="215" y2="130" stroke="#f97316" stroke-width="1.5"/>
  <text x="225" y="118" font-family="Arial, sans-serif" font-size="10" fill="#f97316">δ</text>

  <!-- Legend -->
  <g transform="translate(50, 220)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="25" y="4" font-family="Arial, sans-serif" font-size="9" fill="#666">Ideal (no load)</text>
  </g>
  <g transform="translate(150, 220)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#3b82f6" stroke-width="2"/>
    <text x="25" y="4" font-family="Arial, sans-serif" font-size="9" fill="#666">Actual (with load)</text>
  </g>

  <!-- Formula -->
  <text x="260" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">δ = FL³/3EI</text>
</svg>
