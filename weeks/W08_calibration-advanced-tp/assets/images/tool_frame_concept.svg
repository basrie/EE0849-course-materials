<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d62828"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2a9d3f"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f6ed3"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7b2cbf"/>
    </marker>
  </defs>

  <rect width="400" height="320" fill="#fafafa"/>
  <text x="200" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Tool Frame (UTOOL) Concept</text>

  <!-- Robot wrist/flange body -->
  <rect x="130" y="55" width="60" height="80" rx="6" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="160" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">J6</text>

  <!-- Flange face -->
  <rect x="120" y="135" width="80" height="12" rx="2" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
  <text x="210" y="144" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Flange face</text>

  <!-- Flange frame -->
  <g transform="translate(160, 147)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#d62828" stroke-width="2" marker-end="url(#arr-red)"/>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#2a9d3f" stroke-width="2" marker-end="url(#arr-green)"/>
    <circle cx="0" cy="0" r="3" fill="#64748b"/>
    <text x="45" y="4" font-family="Arial, sans-serif" font-size="9" fill="#d62828">X_f</text>
    <text x="4" y="-42" font-family="Arial, sans-serif" font-size="9" fill="#2a9d3f">Z_f</text>
    <text x="-35" y="4" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Flange</text>
  </g>

  <!-- Tool (gripper) -->
  <g transform="translate(130, 147)">
    <!-- Gripper body -->
    <rect x="10" y="0" width="40" height="50" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Left finger -->
    <rect x="5" y="50" width="14" height="40" rx="2" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Right finger -->
    <rect x="41" y="50" width="14" height="40" rx="2" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Gripper label -->
    <text x="30" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e40af">Gripper</text>
  </g>

  <!-- TCP frame at tool tip -->
  <g transform="translate(160, 237)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#d62828" stroke-width="2.5" marker-end="url(#arr-red)"/>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#2a9d3f" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <circle cx="0" cy="0" r="4" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
    <text x="45" y="4" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#d62828">X_tcp</text>
    <text x="4" y="-42" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2a9d3f">Z_tcp</text>
    <text x="-30" y="4" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ef4444">TCP</text>
  </g>

  <!-- Offset arrow (flange to TCP) -->
  <line x1="110" y1="147" x2="110" y2="237" stroke="#7b2cbf" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-purple)"/>
  <text x="65" y="195" font-family="Arial, sans-serif" font-size="9" fill="#7b2cbf" font-weight="bold">TCP offset</text>
  <text x="70" y="207" font-family="Arial, sans-serif" font-size="8" fill="#7b2cbf">(dx, dy, dz)</text>

  <!-- Dimension annotation -->
  <line x1="98" y1="147" x2="105" y2="147" stroke="#7b2cbf" stroke-width="1"/>
  <line x1="98" y1="237" x2="105" y2="237" stroke="#7b2cbf" stroke-width="1"/>

  <!-- Info boxes -->
  <rect x="230" y="55" width="155" height="60" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="307" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#166534">With correct UTOOL:</text>
  <text x="307" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#166534">Linear moves are straight at TCP</text>
  <text x="307" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#166534">Rotations pivot around TCP</text>
  <text x="307" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#166534">Jog in tool coordinates works</text>

  <rect x="230" y="130" width="155" height="48" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="307" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#991b1b">Without correct UTOOL:</text>
  <text x="307" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#991b1b">Linear moves curve at tool tip</text>
  <text x="307" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#991b1b">Rotations pivot around flange</text>

  <!-- Bottom formula box -->
  <rect x="50" y="270" width="300" height="35" rx="5" fill="#f5f3ff" stroke="#7b2cbf" stroke-width="1"/>
  <text x="200" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5b21b6">T_world_tcp = T_world_flange * T_flange_tcp</text>
</svg>
