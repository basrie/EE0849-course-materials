<rect x="0" y="0" width="760" height="430" fill="#f7f3e8"/>
<text x="34.00" y="40.00" class="title" text-anchor="start">Problem 3: spherical wrist orientation</text>
<circle cx="255.00" cy="220.00" r="12.00" fill="#fff2cc" stroke="#c9851f" stroke-width="3"/>
<text x="255.00" y="198.00" class="small" text-anchor="middle">wrist center</text>
<line x1="105.00" y1="310.00" x2="415.00" y2="130.00" stroke="#c43d2c" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-red)"/>
<line x1="105.00" y1="190.00" x2="405.00" y2="250.00" stroke="#2d7c53" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<line x1="255.00" y1="370.00" x2="255.00" y2="70.00" stroke="#2463a6" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="423.00" y="124.00" class="small" text-anchor="start" fill="#c43d2c">z₄</text>
<text x="415.00" y="242.00" class="small" text-anchor="start" fill="#2d7c53">z₅</text>
<text x="267.00" y="60.00" class="small" text-anchor="start" fill="#2463a6">z₆</text>
<path d="M 334.89 194.04 A 84.00 84.00 0 0 0 283.73 141.07" fill="none" stroke="#c9851f" stroke-width="3" stroke-linecap="round"/>
<path d="M 255.00 116.00 A 104.00 104.00 0 1 1 353.91 187.86" fill="none" stroke="#7b4da3" stroke-width="3" stroke-linecap="round"/>
<path d="M 377.12 241.53 A 124.00 124.00 0 0 0 255.00 96.00" fill="none" stroke="#1f7a7a" stroke-width="3" stroke-linecap="round"/>
<text x="333.00" y="158.00" class="label" text-anchor="start" fill="#c9851f">θ₄</text>
<text x="273.00" y="106.00" class="label" text-anchor="start" fill="#7b4da3">θ₅</text>
<text x="363.00" y="210.00" class="label" text-anchor="start" fill="#1f7a7a">θ₆</text>
<rect x="458.00" y="84.00" width="240.00" height="252.00" fill="#fffaf0" stroke="#d7d2c4" stroke-width="2" rx="18" ry="18"/>
<text x="480.00" y="120.00" class="label" text-anchor="start">Interpretation</text>
<text x="480.00" y="160.00" class="small" text-anchor="start">Axes intersect at one point</text>
<text x="480.00" y="194.00" class="small" text-anchor="start">=> wrist changes orientation</text>
<text x="480.00" y="224.00" class="small" text-anchor="start">without moving the wrist center</text>
<text x="480.00" y="272.00" class="small" text-anchor="start">Use:</text>
<text x="480.00" y="304.00" class="small" text-anchor="start" fill="#2463a6">R₆³ = Rz(θ₄) Ry(θ₅) Rz(θ₆)</text>
