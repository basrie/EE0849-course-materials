<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Joint Space Motion</text>

  <!-- Robot arm representation -->
  <g transform="translate(60, 180)">
    <!-- Base -->
    <rect x="-20" y="0" width="40" height="10" fill="#64748b"/>

    <!-- Link 1 - start position (faded) -->
    <g opacity="0.3">
      <line x1="0" y1="0" x2="50" y2="-40" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="8" fill="#1e40af"/>
      <circle cx="50" cy="-40" r="6" fill="#1e40af"/>
      <!-- Link 2 -->
      <line x1="50" y1="-40" x2="90" y2="-20" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
      <circle cx="90" cy="-20" r="5" fill="#ef4444"/>
    </g>

    <!-- Link 1 - end position -->
    <line x1="0" y1="0" x2="30" y2="-55" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#1e40af"/>
    <circle cx="30" cy="-55" r="6" fill="#1e40af"/>
    <!-- Link 2 -->
    <line x1="30" y1="-55" x2="85" y2="-75" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="85" cy="-75" r="5" fill="#ef4444"/>

    <!-- Motion arc for joint 1 -->
    <path d="M 25 -20 A 30 30 0 0 0 15 -28" stroke="#22c55e" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
    <text x="35" y="-15" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">θ₁(t)</text>

    <!-- Motion arc for joint 2 -->
    <path d="M 65 -50 A 20 20 0 0 0 55 -60" stroke="#f97316" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
    <text x="70" y="-45" font-family="Arial, sans-serif" font-size="10" fill="#f97316">θ₂(t)</text>
  </g>

  <!-- Joint angle plots -->
  <g transform="translate(200, 60)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="170" y2="100" stroke="#333" stroke-width="1" marker-end="url(#arrow1)"/>
    <line x1="0" y1="100" x2="0" y2="10" stroke="#333" stroke-width="1" marker-end="url(#arrow1)"/>

    <text x="175" y="105" font-family="Arial, sans-serif" font-size="10" fill="#333">t</text>
    <text x="-5" y="5" font-family="Arial, sans-serif" font-size="10" fill="#333">θ</text>

    <!-- Joint 1 trajectory -->
    <path d="M 0 80 Q 40 75 80 50 T 150 30" stroke="#22c55e" stroke-width="2" fill="none"/>
    <text x="155" y="30" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">θ₁(t)</text>

    <!-- Joint 2 trajectory -->
    <path d="M 0 90 Q 40 88 80 70 T 150 55" stroke="#f97316" stroke-width="2" fill="none"/>
    <text x="155" y="55" font-family="Arial, sans-serif" font-size="10" fill="#f97316">θ₂(t)</text>

    <!-- Labels -->
    <text x="75" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Interpolate in joint angles</text>
  </g>

  <!-- Info box -->
  <rect x="20" y="230" width="360" height="55" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">Plan trajectory as θ(t) = [θ₁(t), θ₂(t), ..., θₙ(t)]</text>
  <text x="200" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">Simple interpolation, no IK needed, but Cartesian path unpredictable</text>
</svg>
