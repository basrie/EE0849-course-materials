<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480">
  <defs>
    <marker id="arr5" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="420" height="480" fill="#fafafa"/>

  <!-- ==================== WITHOUT BLENDING ==================== -->
  <g transform="translate(15, 10)">
    <rect x="0" y="0" width="390" height="220" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="195" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Without Blending</text>

    <!-- Path diagram -->
    <g transform="translate(10, 35)">
      <text x="85" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Path</text>

      <!-- Straight line path with stop -->
      <line x1="20" y1="70" x2="85" y2="25" stroke="#dc2626" stroke-width="2.5"/>
      <line x1="85" y1="25" x2="150" y2="50" stroke="#dc2626" stroke-width="2.5"/>

      <!-- Points -->
      <circle cx="20" cy="70" r="6" fill="#22c55e"/>
      <text x="20" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">P1</text>

      <circle cx="85" cy="25" r="6" fill="#f97316"/>
      <text x="85" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f97316">Via</text>

      <circle cx="150" cy="50" r="6" fill="#ef4444"/>
      <text x="150" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">P2</text>

      <!-- Stop indicator -->
      <text x="105" y="22" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#dc2626">STOP</text>
    </g>

    <!-- Velocity profile -->
    <g transform="translate(200, 35)">
      <text x="85" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Velocity Profile</text>

      <!-- Axes -->
      <line x1="10" y1="75" x2="170" y2="75" stroke="#333" stroke-width="1" marker-end="url(#arr5)"/>
      <line x1="10" y1="75" x2="10" y2="10" stroke="#333" stroke-width="1" marker-end="url(#arr5)"/>
      <text x="175" y="78" font-family="Arial, sans-serif" font-size="8" fill="#333">t</text>
      <text x="5" y="8" font-family="Arial, sans-serif" font-size="8" fill="#333">v</text>

      <!-- Velocity: ramp up, down to zero, ramp up, down -->
      <path d="M 10 75 L 30 30 L 50 30 L 70 75 L 90 75 L 110 30 L 130 30 L 150 75" stroke="#dc2626" stroke-width="2" fill="none"/>

      <!-- Zero velocity marker at via point -->
      <circle cx="80" cy="75" r="4" fill="#dc2626"/>
      <text x="80" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#dc2626">v=0</text>

      <!-- Time markers -->
      <line x1="80" y1="73" x2="80" y2="77" stroke="#666" stroke-width="1"/>
      <text x="80" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">at Via</text>
    </g>

    <!-- Acceleration profile -->
    <g transform="translate(10, 125)">
      <text x="85" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Acceleration Profile</text>

      <!-- Axes -->
      <line x1="10" y1="50" x2="170" y2="50" stroke="#333" stroke-width="1" marker-end="url(#arr5)"/>
      <line x1="10" y1="80" x2="10" y2="15" stroke="#333" stroke-width="1" marker-end="url(#arr5)"/>
      <text x="175" y="53" font-family="Arial, sans-serif" font-size="8" fill="#333">t</text>
      <text x="5" y="13" font-family="Arial, sans-serif" font-size="8" fill="#333">a</text>

      <!-- Acceleration: +a, -a, stop, +a, -a -->
      <line x1="10" y1="50" x2="10" y2="28" stroke="#f97316" stroke-width="2"/>
      <line x1="10" y1="28" x2="30" y2="28" stroke="#f97316" stroke-width="2"/>
      <line x1="30" y1="28" x2="30" y2="50" stroke="#f97316" stroke-width="2"/>
      <line x1="30" y1="50" x2="30" y2="72" stroke="#f97316" stroke-width="2"/>
      <line x1="30" y1="72" x2="50" y2="72" stroke="#f97316" stroke-width="2"/>
      <line x1="50" y1="72" x2="50" y2="50" stroke="#f97316" stroke-width="2"/>
      <!-- Gap at via -->
      <line x1="50" y1="50" x2="90" y2="50" stroke="#f97316" stroke-width="2"/>
      <!-- Second segment -->
      <line x1="90" y1="50" x2="90" y2="28" stroke="#f97316" stroke-width="2"/>
      <line x1="90" y1="28" x2="110" y2="28" stroke="#f97316" stroke-width="2"/>
      <line x1="110" y1="28" x2="110" y2="50" stroke="#f97316" stroke-width="2"/>
      <line x1="110" y1="50" x2="110" y2="72" stroke="#f97316" stroke-width="2"/>
      <line x1="110" y1="72" x2="130" y2="72" stroke="#f97316" stroke-width="2"/>
      <line x1="130" y1="72" x2="130" y2="50" stroke="#f97316" stroke-width="2"/>
      <line x1="130" y1="50" x2="150" y2="50" stroke="#f97316" stroke-width="2"/>
    </g>

    <!-- Note -->
    <text x="290" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#991b1b">Decel → Stop → Accel</text>
    <text x="290" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#991b1b">at each via point</text>
  </g>

  <!-- ==================== WITH BLENDING ==================== -->
  <g transform="translate(15, 245)">
    <rect x="0" y="0" width="390" height="220" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="195" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#22c55e">With Blending</text>

    <!-- Path diagram -->
    <!-- Line 1: P1(20,70) to Via(85,25), slope = -45/65 = -0.692 -->
    <!-- Line 2: Via(85,25) to P2(150,50), slope = 25/65 = 0.385 -->
    <!-- Blend starts at x=60: y = 70 + (60-20)*(-45/65) = 70 - 27.7 = 42.3 -->
    <!-- Blend ends at x=110: y = 25 + (110-85)*(25/65) = 25 + 9.6 = 34.6 -->
    <g transform="translate(10, 35)">
      <text x="85" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Path</text>

      <!-- Original straight segments (faded) -->
      <line x1="20" y1="70" x2="85" y2="25" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
      <line x1="85" y1="25" x2="150" y2="50" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>

      <!-- Blended path: follows lines outside blend, curves inside -->
      <!-- P1 to blend start (follows line 1) -->
      <line x1="20" y1="70" x2="60" y2="42" stroke="#22c55e" stroke-width="2.5"/>
      <!-- Blend curve (smooth transition) -->
      <path d="M 60 42 Q 85 28 110 35" stroke="#22c55e" stroke-width="2.5" fill="none"/>
      <!-- Blend end to P2 (follows line 2) -->
      <line x1="110" y1="35" x2="150" y2="50" stroke="#22c55e" stroke-width="2.5"/>

      <!-- Blend zone highlight -->
      <ellipse cx="85" cy="35" rx="28" ry="18" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="85" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#16a34a">blend zone</text>

      <!-- Points -->
      <circle cx="20" cy="70" r="6" fill="#22c55e"/>
      <text x="20" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">P1</text>

      <!-- Via point (not reached exactly) -->
      <circle cx="85" cy="25" r="4" fill="#f97316" stroke="#fff" stroke-width="1.5"/>
      <text x="85" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#f97316">Via</text>

      <circle cx="150" cy="50" r="6" fill="#ef4444"/>
      <text x="150" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">P2</text>

      <!-- Blend entry/exit markers -->
      <circle cx="60" cy="42" r="3" fill="#3b82f6"/>
      <circle cx="110" cy="35" r="3" fill="#3b82f6"/>
    </g>

    <!-- Velocity profile -->
    <g transform="translate(200, 35)">
      <text x="85" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Velocity Profile</text>

      <!-- Axes -->
      <line x1="10" y1="75" x2="170" y2="75" stroke="#333" stroke-width="1" marker-end="url(#arr5)"/>
      <line x1="10" y1="75" x2="10" y2="10" stroke="#333" stroke-width="1" marker-end="url(#arr5)"/>
      <text x="175" y="78" font-family="Arial, sans-serif" font-size="8" fill="#333">t</text>
      <text x="5" y="8" font-family="Arial, sans-serif" font-size="8" fill="#333">v</text>

      <!-- Velocity: continuous, slight dip in blend zone but never zero -->
      <path d="M 10 75 L 30 30 L 60 30 Q 80 40 100 30 L 130 30 L 150 75" stroke="#22c55e" stroke-width="2" fill="none"/>

      <!-- Blend zone highlight -->
      <rect x="60" y="25" width="40" height="22" fill="#22c55e" fill-opacity="0.15" rx="3"/>

      <!-- Non-zero velocity marker at via point -->
      <circle cx="80" cy="38" r="4" fill="#22c55e"/>
      <text x="80" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">v≠0</text>

      <text x="80" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">blend zone</text>
    </g>

    <!-- Acceleration profile -->
    <g transform="translate(10, 125)">
      <text x="85" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Acceleration Profile</text>

      <!-- Axes -->
      <line x1="10" y1="50" x2="170" y2="50" stroke="#333" stroke-width="1" marker-end="url(#arr5)"/>
      <line x1="10" y1="80" x2="10" y2="15" stroke="#333" stroke-width="1" marker-end="url(#arr5)"/>
      <text x="175" y="53" font-family="Arial, sans-serif" font-size="8" fill="#333">t</text>
      <text x="5" y="13" font-family="Arial, sans-serif" font-size="8" fill="#333">a</text>

      <!-- Acceleration: initial accel, cruise, blend transition, cruise, final decel -->
      <!-- Initial acceleration phase -->
      <line x1="10" y1="50" x2="10" y2="28" stroke="#f97316" stroke-width="2"/>
      <line x1="10" y1="28" x2="25" y2="28" stroke="#f97316" stroke-width="2"/>
      <line x1="25" y1="28" x2="25" y2="50" stroke="#f97316" stroke-width="2"/>
      <!-- Cruise before blend -->
      <line x1="25" y1="50" x2="60" y2="50" stroke="#f97316" stroke-width="2"/>
      <!-- Blend zone: smooth decel then accel (direction change) -->
      <path d="M 60 50 Q 70 68 80 68 Q 90 68 100 50" stroke="#f97316" stroke-width="2" fill="none"/>
      <!-- Cruise after blend -->
      <line x1="100" y1="50" x2="135" y2="50" stroke="#f97316" stroke-width="2"/>
      <!-- Final deceleration -->
      <line x1="135" y1="50" x2="135" y2="72" stroke="#f97316" stroke-width="2"/>
      <line x1="135" y1="72" x2="150" y2="72" stroke="#f97316" stroke-width="2"/>
      <line x1="150" y1="72" x2="150" y2="50" stroke="#f97316" stroke-width="2"/>

      <!-- Blend zone highlight -->
      <rect x="60" y="42" width="40" height="32" fill="#22c55e" fill-opacity="0.15" rx="3"/>
    </g>

    <!-- Note -->
    <text x="290" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#166534">Smooth transition</text>
    <text x="290" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#166534">v never reaches zero</text>
  </g>
</svg>
