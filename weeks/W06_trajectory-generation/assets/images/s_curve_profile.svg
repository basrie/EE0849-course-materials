<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 350">
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="550" height="350" fill="#fafafa"/>

  <!-- Title -->
  <text x="275" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">S-Curve (7-Segment) Velocity Profile</text>

  <!-- Position plot -->
  <g transform="translate(30, 50)">
    <text x="75" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Position</text>

    <!-- Axes -->
    <line x1="0" y1="80" x2="160" y2="80" stroke="#333" stroke-width="1" marker-end="url(#arrow7)"/>
    <line x1="0" y1="80" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arrow7)"/>

    <!-- Smooth S-curve position -->
    <path d="M 0 75 C 10 75 15 74 22 70 C 30 65 38 55 45 45 C 52 38 58 32 70 25 L 90 18 C 102 12 108 10 115 10 C 122 10 130 12 138 18 C 145 22 150 25 150 25" stroke="#2563eb" stroke-width="2" fill="none"/>
  </g>

  <!-- Velocity plot (S-curve shape) -->
  <g transform="translate(200, 50)">
    <text x="75" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22c55e">Velocity</text>

    <!-- Axes -->
    <line x1="0" y1="80" x2="160" y2="80" stroke="#333" stroke-width="1" marker-end="url(#arrow7)"/>
    <line x1="0" y1="80" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arrow7)"/>

    <!-- S-curve velocity: smooth transitions -->
    <path d="M 0 80 C 8 80 12 75 18 65 C 22 58 26 50 30 45 C 34 40 38 35 45 32 L 60 32 C 67 32 72 35 78 40 L 82 45 C 88 52 92 60 98 68 C 105 76 112 80 120 80 L 150 80" stroke="#22c55e" stroke-width="2" fill="none"/>

    <!-- Segment markers -->
    <line x1="18" y1="78" x2="18" y2="82" stroke="#999" stroke-width="1"/>
    <line x1="30" y1="78" x2="30" y2="82" stroke="#999" stroke-width="1"/>
    <line x1="45" y1="78" x2="45" y2="82" stroke="#999" stroke-width="1"/>
    <line x1="60" y1="78" x2="60" y2="82" stroke="#999" stroke-width="1"/>
    <line x1="78" y1="78" x2="78" y2="82" stroke="#999" stroke-width="1"/>
    <line x1="98" y1="78" x2="98" y2="82" stroke="#999" stroke-width="1"/>
    <line x1="120" y1="78" x2="120" y2="82" stroke="#999" stroke-width="1"/>

    <!-- Segment numbers -->
    <text x="9" y="95" font-family="Arial, sans-serif" font-size="7" fill="#666">1</text>
    <text x="24" y="95" font-family="Arial, sans-serif" font-size="7" fill="#666">2</text>
    <text x="37" y="95" font-family="Arial, sans-serif" font-size="7" fill="#666">3</text>
    <text x="52" y="95" font-family="Arial, sans-serif" font-size="7" fill="#666">4</text>
    <text x="69" y="95" font-family="Arial, sans-serif" font-size="7" fill="#666">5</text>
    <text x="88" y="95" font-family="Arial, sans-serif" font-size="7" fill="#666">6</text>
    <text x="109" y="95" font-family="Arial, sans-serif" font-size="7" fill="#666">7</text>
  </g>

  <!-- Acceleration plot -->
  <g transform="translate(370, 50)">
    <text x="75" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f97316">Acceleration</text>

    <!-- Axes -->
    <line x1="0" y1="45" x2="160" y2="45" stroke="#333" stroke-width="1" marker-end="url(#arrow7)"/>
    <line x1="0" y1="80" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arrow7)"/>

    <!-- Smooth trapezoid acceleration -->
    <path d="M 0 45 L 18 20 L 30 20 L 45 45 L 60 45 L 78 70 L 98 70 L 120 45 L 150 45" stroke="#f97316" stroke-width="2" fill="none"/>
  </g>

  <!-- 7 Segments explanation -->
  <rect x="30" y="170" width="490" height="165" rx="5" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="275" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">The Seven Segments</text>

  <!-- Two columns for segments -->
  <g transform="translate(50, 210)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" fill="#166534" font-weight="bold">Acceleration Phase:</text>
    <text x="10" y="18" font-family="Arial, sans-serif" font-size="10" fill="#166534">1. Increasing acceleration (jerk &gt; 0)</text>
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="10" fill="#166534">2. Constant acceleration (jerk = 0)</text>
    <text x="10" y="52" font-family="Arial, sans-serif" font-size="10" fill="#166534">3. Decreasing acceleration (jerk &lt; 0)</text>

    <text x="0" y="75" font-family="Arial, sans-serif" font-size="10" fill="#166534" font-weight="bold">Cruise Phase:</text>
    <text x="10" y="93" font-family="Arial, sans-serif" font-size="10" fill="#166534">4. Constant velocity (accel = 0)</text>
  </g>

  <g transform="translate(280, 210)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" fill="#166534" font-weight="bold">Deceleration Phase:</text>
    <text x="10" y="18" font-family="Arial, sans-serif" font-size="10" fill="#166534">5. Increasing deceleration (jerk &lt; 0)</text>
    <text x="10" y="35" font-family="Arial, sans-serif" font-size="10" fill="#166534">6. Constant deceleration (jerk = 0)</text>
    <text x="10" y="52" font-family="Arial, sans-serif" font-size="10" fill="#166534">7. Decreasing deceleration (jerk &gt; 0)</text>

    <text x="0" y="75" font-family="Arial, sans-serif" font-size="10" fill="#6366f1" font-weight="bold">Key benefit:</text>
    <text x="10" y="93" font-family="Arial, sans-serif" font-size="10" fill="#6366f1">Bounded jerk → smooth motion</text>
  </g>
</svg>
