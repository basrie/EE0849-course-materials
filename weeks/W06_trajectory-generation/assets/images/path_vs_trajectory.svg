<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Path vs Trajectory</text>

  <!-- Left side: Path -->
  <text x="125" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Path (Geometry Only)</text>

  <!-- Path curve -->
  <circle cx="50" cy="120" r="8" fill="#22c55e"/>
  <text x="50" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">A</text>

  <path d="M 58 120 Q 100 80 125 100 T 192 120" stroke="#2563eb" stroke-width="3" fill="none"/>

  <circle cx="200" cy="120" r="8" fill="#ef4444"/>
  <text x="200" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">B</text>

  <!-- Path description -->
  <text x="125" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Where the robot goes</text>
  <text x="125" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">(sequence of positions)</text>

  <!-- Divider -->
  <line x1="250" y1="45" x2="250" y2="280" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Right side: Trajectory -->
  <text x="375" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Trajectory (Path + Time)</text>

  <!-- Trajectory curve with time markers -->
  <circle cx="300" cy="120" r="8" fill="#22c55e"/>
  <text x="300" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">A (t=0)</text>

  <path d="M 308 120 Q 350 80 375 100 T 442 120" stroke="#dc2626" stroke-width="3" fill="none"/>

  <!-- Time markers along path -->
  <circle cx="340" cy="92" r="4" fill="#f97316"/>
  <text x="340" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">t=1s</text>

  <circle cx="375" cy="100" r="4" fill="#f97316"/>
  <text x="375" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">t=2s</text>

  <circle cx="410" cy="108" r="4" fill="#f97316"/>
  <text x="410" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">t=3s</text>

  <circle cx="450" cy="120" r="8" fill="#ef4444"/>
  <text x="450" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">B (t=4s)</text>

  <!-- Trajectory description -->
  <text x="375" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Where AND when</text>
  <text x="375" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">(positions + velocities + accelerations)</text>

  <!-- Bottom comparison boxes -->
  <rect x="30" y="210" width="190" height="70" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">q = [q1, q2, ..., qn]</text>
  <text x="125" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">Geometric curve</text>
  <text x="125" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">No timing info</text>

  <rect x="280" y="210" width="190" height="70" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="375" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">q(t), q'(t), q''(t)</text>
  <text x="375" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">Time-parameterized</text>
  <text x="375" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">Includes dynamics</text>
</svg>
