<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="200" fill="#fafafa"/>

  <!-- Position plot -->
  <g transform="translate(20, 25)">
    <text x="95" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Position q(t)</text>

    <!-- Axes -->
    <line x1="0" y1="140" x2="200" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arr1)"/>
    <line x1="0" y1="140" x2="0" y2="10" stroke="#333" stroke-width="1.5" marker-end="url(#arr1)"/>
    <text x="205" y="145" font-family="Arial, sans-serif" font-size="11" fill="#333">t</text>
    <text x="-5" y="5" font-family="Arial, sans-serif" font-size="11" fill="#333">q</text>

    <!-- Cubic S-curve position -->
    <path d="M 0 125 C 40 125 60 110 95 70 C 130 30 150 15 180 15" stroke="#2563eb" stroke-width="3" fill="none"/>

    <!-- Start/end markers -->
    <circle cx="0" cy="125" r="5" fill="#22c55e"/>
    <circle cx="180" cy="15" r="5" fill="#ef4444"/>

    <!-- Labels -->
    <text x="-15" y="128" font-family="Arial, sans-serif" font-size="10" fill="#666">q₀</text>
    <text x="185" y="20" font-family="Arial, sans-serif" font-size="10" fill="#666">qf</text>
    <text x="90" y="158" font-family="Arial, sans-serif" font-size="10" fill="#666">tf</text>
    <line x1="180" y1="138" x2="180" y2="142" stroke="#333" stroke-width="1"/>
  </g>

  <!-- Velocity plot -->
  <g transform="translate(250, 25)">
    <text x="95" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#22c55e">Velocity q̇(t)</text>

    <!-- Axes -->
    <line x1="0" y1="140" x2="200" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arr1)"/>
    <line x1="0" y1="140" x2="0" y2="10" stroke="#333" stroke-width="1.5" marker-end="url(#arr1)"/>
    <text x="205" y="145" font-family="Arial, sans-serif" font-size="11" fill="#333">t</text>
    <text x="-5" y="5" font-family="Arial, sans-serif" font-size="11" fill="#333">v</text>

    <!-- Parabolic velocity (starts and ends at 0) -->
    <path d="M 0 140 Q 90 30 180 140" stroke="#22c55e" stroke-width="3" fill="none"/>

    <!-- Start/end at zero markers -->
    <circle cx="0" cy="140" r="5" fill="#22c55e"/>
    <circle cx="180" cy="140" r="5" fill="#22c55e"/>

    <!-- Peak marker -->
    <circle cx="90" cy="45" r="4" fill="#f97316"/>
    <text x="100" y="42" font-family="Arial, sans-serif" font-size="10" fill="#f97316">vmax</text>

    <!-- Annotations -->
    <text x="8" y="128" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">v=0</text>
    <text x="158" y="128" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">v=0</text>
  </g>

  <!-- Acceleration plot -->
  <g transform="translate(480, 25)">
    <text x="95" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f97316">Acceleration q̈(t)</text>

    <!-- Axes -->
    <line x1="0" y1="80" x2="200" y2="80" stroke="#333" stroke-width="1.5" marker-end="url(#arr1)"/>
    <line x1="0" y1="155" x2="0" y2="10" stroke="#333" stroke-width="1.5" marker-end="url(#arr1)"/>
    <text x="205" y="85" font-family="Arial, sans-serif" font-size="11" fill="#333">t</text>
    <text x="-5" y="5" font-family="Arial, sans-serif" font-size="11" fill="#333">a</text>

    <!-- Linear acceleration (decreasing) -->
    <line x1="0" y1="30" x2="180" y2="130" stroke="#f97316" stroke-width="3"/>

    <!-- Start/end markers -->
    <circle cx="0" cy="30" r="5" fill="#f97316"/>
    <circle cx="180" cy="130" r="5" fill="#f97316"/>

    <!-- Zero crossing -->
    <circle cx="90" cy="80" r="4" fill="#666"/>

    <!-- Labels -->
    <text x="8" y="25" font-family="Arial, sans-serif" font-size="10" fill="#ea580c">+a₀</text>
    <text x="185" y="135" font-family="Arial, sans-serif" font-size="10" fill="#ea580c">−a₀</text>

    <!-- Discontinuity markers -->
    <path d="M -8 30 L 0 30" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="-25" y="45" font-family="Arial, sans-serif" font-size="8" fill="#ef4444">jump</text>
  </g>
</svg>
