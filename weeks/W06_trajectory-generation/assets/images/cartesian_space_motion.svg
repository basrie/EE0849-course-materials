<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Cartesian Space Motion</text>

  <!-- Robot arm with straight line path -->
  <g transform="translate(60, 180)">
    <!-- Base -->
    <rect x="-20" y="0" width="40" height="10" fill="#64748b"/>

    <!-- Cartesian coordinate frame -->
    <line x1="-30" y1="-100" x2="-30" y2="5" stroke="#666" stroke-width="1"/>
    <line x1="-35" y1="0" x2="120" y2="0" stroke="#666" stroke-width="1"/>
    <text x="125" y="5" font-family="Arial, sans-serif" font-size="10" fill="#666">X</text>
    <text x="-35" y="-105" font-family="Arial, sans-serif" font-size="10" fill="#666">Y</text>

    <!-- Straight line path (the trajectory) -->
    <line x1="90" y1="-20" x2="85" y2="-75" stroke="#dc2626" stroke-width="3" stroke-dasharray="8,4"/>

    <!-- Start point -->
    <circle cx="90" cy="-20" r="6" fill="#22c55e"/>
    <text x="100" y="-15" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">Start</text>

    <!-- End point -->
    <circle cx="85" cy="-75" r="6" fill="#ef4444"/>
    <text x="95" y="-75" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">End</text>

    <!-- Intermediate points -->
    <circle cx="89" cy="-35" r="3" fill="#f97316"/>
    <circle cx="88" cy="-50" r="3" fill="#f97316"/>
    <circle cx="86" cy="-65" r="3" fill="#f97316"/>

    <!-- Robot arm (one configuration) -->
    <line x1="0" y1="0" x2="40" y2="-50" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <line x1="40" y1="-50" x2="88" y2="-50" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <circle cx="0" cy="0" r="6" fill="#64748b" opacity="0.5"/>
    <circle cx="40" cy="-50" r="5" fill="#64748b" opacity="0.5"/>

    <!-- IK notation -->
    <text x="45" y="-25" font-family="Arial, sans-serif" font-size="9" fill="#666">IK at</text>
    <text x="45" y="-15" font-family="Arial, sans-serif" font-size="9" fill="#666">each point</text>
  </g>

  <!-- Cartesian position plot -->
  <g transform="translate(200, 60)">
    <!-- Axes -->
    <line x1="0" y1="100" x2="170" y2="100" stroke="#333" stroke-width="1" marker-end="url(#arrow2)"/>
    <line x1="0" y1="100" x2="0" y2="10" stroke="#333" stroke-width="1" marker-end="url(#arrow2)"/>

    <text x="175" y="105" font-family="Arial, sans-serif" font-size="10" fill="#333">t</text>
    <text x="-5" y="5" font-family="Arial, sans-serif" font-size="10" fill="#333">pos</text>

    <!-- X trajectory (nearly constant) -->
    <path d="M 0 50 L 150 48" stroke="#ef4444" stroke-width="2" fill="none"/>
    <text x="155" y="48" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">x(t)</text>

    <!-- Y trajectory (linear change) -->
    <path d="M 0 80 Q 75 50 150 30" stroke="#22c55e" stroke-width="2" fill="none"/>
    <text x="155" y="30" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">y(t)</text>

    <!-- Z trajectory -->
    <path d="M 0 70 L 150 70" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <text x="155" y="70" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">z(t)</text>

    <!-- Labels -->
    <text x="75" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Interpolate in Cartesian</text>
  </g>

  <!-- Info box -->
  <rect x="20" y="230" width="360" height="55" rx="5" fill="#fee2e2" stroke="#dc2626"/>
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">Plan trajectory as p(t) = [x(t), y(t), z(t), R(t)]</text>
  <text x="200" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">Predictable end-effector path, requires IK at each timestep</text>
</svg>
