<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200">
  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="520" height="200" fill="#fafafa"/>

  <!-- ============================================ -->
  <!-- Position plot -->
  <!-- ============================================ -->
  <g transform="translate(30, 40)">
    <text x="70" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Position q(t)</text>

    <!-- Axes -->
    <line x1="0" y1="120" x2="155" y2="120" stroke="#333" stroke-width="1" marker-end="url(#arrow6)"/>
    <line x1="0" y1="120" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arrow6)"/>
    <text x="160" y="125" font-family="Arial, sans-serif" font-size="10" fill="#333">t</text>
    <text x="-5" y="0" font-family="Arial, sans-serif" font-size="10" fill="#333">q</text>

    <!-- Position curve: parabola + line + parabola -->
    <path d="M 0 110 Q 22 104 38 82 L 100 38 Q 115 16 135 10" stroke="#2563eb" stroke-width="2.5" fill="none"/>

    <!-- Phase markers -->
    <line x1="38" y1="118" x2="38" y2="122" stroke="#666" stroke-width="1"/>
    <line x1="100" y1="118" x2="100" y2="122" stroke="#666" stroke-width="1"/>
    <text x="15" y="137" font-family="Arial, sans-serif" font-size="9" fill="#666">t<tspan font-size="7" baseline-shift="sub">a</tspan></text>
    <text x="85" y="137" font-family="Arial, sans-serif" font-size="9" fill="#666">t<tspan font-size="7" baseline-shift="sub">f</tspan>-t<tspan font-size="7" baseline-shift="sub">a</tspan></text>

    <!-- q0 and qf labels -->
    <text x="-10" y="113" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="end">q<tspan font-size="7" baseline-shift="sub">0</tspan></text>
    <text x="-10" y="14" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="end">q<tspan font-size="7" baseline-shift="sub">f</tspan></text>
    <line x1="-5" y1="110" x2="0" y2="110" stroke="#666" stroke-width="0.5"/>
    <line x1="-5" y1="10" x2="0" y2="10" stroke="#666" stroke-width="0.5"/>
  </g>

  <!-- ============================================ -->
  <!-- Velocity plot (trapezoid) -->
  <!-- ============================================ -->
  <g transform="translate(200, 40)">
    <text x="70" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#22c55e">Velocity q&#x27;(t)</text>

    <!-- Axes -->
    <line x1="0" y1="120" x2="155" y2="120" stroke="#333" stroke-width="1" marker-end="url(#arrow6)"/>
    <line x1="0" y1="120" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arrow6)"/>
    <text x="160" y="125" font-family="Arial, sans-serif" font-size="10" fill="#333">t</text>
    <text x="-5" y="0" font-family="Arial, sans-serif" font-size="10" fill="#333">v</text>

    <!-- Trapezoidal velocity profile -->
    <path d="M 0 120 L 38 42 L 100 42 L 135 120" stroke="#22c55e" stroke-width="2.5" fill="none"/>

    <!-- Fill the trapezoid lightly -->
    <path d="M 0 120 L 38 42 L 100 42 L 135 120 Z" fill="#22c55e" fill-opacity="0.08"/>

    <!-- Shade da (accel phase area) -->
    <path d="M 0 120 L 38 42 L 38 120 Z" fill="#f59e0b" fill-opacity="0.25"/>

    <!-- da label -->
    <text x="14" y="105" font-family="Arial, sans-serif" font-size="9" fill="#92400e" font-weight="bold">d<tspan font-size="7" baseline-shift="sub">a</tspan></text>

    <!-- Phase labels -->
    <text x="8" y="65" font-family="Arial, sans-serif" font-size="9" fill="#166534">Accel</text>
    <text x="57" y="32" font-family="Arial, sans-serif" font-size="9" fill="#166534">Cruise</text>
    <text x="105" y="65" font-family="Arial, sans-serif" font-size="9" fill="#166534">Decel</text>

    <!-- vmax label -->
    <line x1="-5" y1="42" x2="0" y2="42" stroke="#666" stroke-width="0.5"/>
    <text x="-10" y="45" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="end">v<tspan font-size="7" baseline-shift="sub">max</tspan></text>

    <!-- Phase time markers -->
    <line x1="38" y1="118" x2="38" y2="122" stroke="#666" stroke-width="1"/>
    <line x1="100" y1="118" x2="100" y2="122" stroke="#666" stroke-width="1"/>
    <line x1="135" y1="118" x2="135" y2="122" stroke="#666" stroke-width="1"/>
    <text x="15" y="137" font-family="Arial, sans-serif" font-size="9" fill="#666">t<tspan font-size="7" baseline-shift="sub">a</tspan></text>
    <text x="69" y="137" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">t<tspan font-size="7" baseline-shift="sub">c</tspan></text>
    <text x="113" y="137" font-family="Arial, sans-serif" font-size="9" fill="#666">t<tspan font-size="7" baseline-shift="sub">a</tspan></text>
  </g>

  <!-- ============================================ -->
  <!-- Acceleration plot -->
  <!-- ============================================ -->
  <g transform="translate(375, 40)">
    <text x="65" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f97316">Acceleration q&#x27;&#x27;(t)</text>

    <!-- Axes -->
    <line x1="0" y1="65" x2="140" y2="65" stroke="#333" stroke-width="1" marker-end="url(#arrow6)"/>
    <line x1="0" y1="120" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arrow6)"/>
    <text x="145" y="70" font-family="Arial, sans-serif" font-size="10" fill="#333">t</text>
    <text x="-5" y="0" font-family="Arial, sans-serif" font-size="10" fill="#333">a</text>

    <!-- Step acceleration -->
    <line x1="0" y1="65" x2="0" y2="25" stroke="#f97316" stroke-width="2.5"/>
    <line x1="0" y1="25" x2="38" y2="25" stroke="#f97316" stroke-width="2.5"/>
    <line x1="38" y1="25" x2="38" y2="65" stroke="#f97316" stroke-width="2.5"/>
    <line x1="38" y1="65" x2="100" y2="65" stroke="#f97316" stroke-width="2.5"/>
    <line x1="100" y1="65" x2="100" y2="105" stroke="#f97316" stroke-width="2.5"/>
    <line x1="100" y1="105" x2="135" y2="105" stroke="#f97316" stroke-width="2.5"/>
    <line x1="135" y1="105" x2="135" y2="65" stroke="#f97316" stroke-width="2.5"/>

    <!-- Labels -->
    <text x="-10" y="28" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="end">+a<tspan font-size="7" baseline-shift="sub">max</tspan></text>
    <text x="-10" y="108" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="end">-a<tspan font-size="7" baseline-shift="sub">max</tspan></text>
  </g>
</svg>
