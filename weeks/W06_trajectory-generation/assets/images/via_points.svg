<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280">
  <defs>
    <marker id="arrow10" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="450" height="280" fill="#fafafa"/>

  <!-- Title -->
  <text x="225" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Via Points (Waypoints)</text>

  <!-- 2D path visualization -->
  <g transform="translate(30, 50)">
    <text x="85" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Path with Via Points</text>

    <!-- Grid -->
    <line x1="0" y1="0" x2="0" y2="150" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="40" y1="0" x2="40" y2="150" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="150" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="150" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="150" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="0" y1="0" x2="170" y2="0" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="0" y1="50" x2="170" y2="50" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="0" y1="100" x2="170" y2="100" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="0" y1="150" x2="170" y2="150" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Path segments -->
    <path d="M 20 130 Q 40 100 60 80" stroke="#2563eb" stroke-width="2" fill="none"/>
    <path d="M 60 80 Q 80 60 100 50" stroke="#2563eb" stroke-width="2" fill="none"/>
    <path d="M 100 50 Q 120 40 140 30" stroke="#2563eb" stroke-width="2" fill="none"/>
    <path d="M 140 30 Q 155 25 160 20" stroke="#2563eb" stroke-width="2" fill="none"/>

    <!-- Start point -->
    <circle cx="20" cy="130" r="8" fill="#22c55e"/>
    <text x="20" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Start</text>

    <!-- Via points -->
    <circle cx="60" cy="80" r="6" fill="#f97316"/>
    <text x="60" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f97316">Via 1</text>

    <circle cx="100" cy="50" r="6" fill="#f97316"/>
    <text x="100" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f97316">Via 2</text>

    <circle cx="140" cy="30" r="6" fill="#f97316"/>
    <text x="145" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f97316">Via 3</text>

    <!-- End point -->
    <circle cx="160" cy="20" r="8" fill="#ef4444"/>
    <text x="160" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">End</text>
  </g>

  <!-- Joint trajectory plot -->
  <g transform="translate(240, 50)">
    <text x="95" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#22c55e">Joint Trajectory q(t)</text>

    <!-- Axes -->
    <line x1="0" y1="150" x2="200" y2="150" stroke="#333" stroke-width="1" marker-end="url(#arrow10)"/>
    <line x1="0" y1="150" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arrow10)"/>
    <text x="205" y="155" font-family="Arial, sans-serif" font-size="10" fill="#333">t</text>
    <text x="-5" y="0" font-family="Arial, sans-serif" font-size="10" fill="#333">q</text>

    <!-- Trajectory with via points -->
    <path d="M 0 130 C 20 120 30 95 50 85 C 70 75 80 60 100 55 C 120 50 130 35 150 30 C 170 25 180 20 180 15" stroke="#22c55e" stroke-width="2" fill="none"/>

    <!-- Via point markers -->
    <circle cx="0" cy="130" r="5" fill="#22c55e"/>
    <circle cx="50" cy="85" r="4" fill="#f97316"/>
    <circle cx="100" cy="55" r="4" fill="#f97316"/>
    <circle cx="150" cy="30" r="4" fill="#f97316"/>
    <circle cx="180" cy="15" r="5" fill="#ef4444"/>

    <!-- Time markers -->
    <line x1="50" y1="148" x2="50" y2="152" stroke="#666" stroke-width="1"/>
    <line x1="100" y1="148" x2="100" y2="152" stroke="#666" stroke-width="1"/>
    <line x1="150" y1="148" x2="150" y2="152" stroke="#666" stroke-width="1"/>
    <text x="50" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">t₁</text>
    <text x="100" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">t₂</text>
    <text x="150" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">t₃</text>
  </g>

  <!-- Requirements box -->
  <rect x="30" y="215" width="390" height="55" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="225" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Continuity Requirements at Via Points</text>
  <text x="225" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">Position: q(ti⁻) = q(ti⁺) | Velocity: q'(ti⁻) = q'(ti⁺) | Acceleration: q''(ti⁻) = q''(ti⁺)</text>
</svg>
