<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Trajectory Generation Summary</text>

  <!-- Column 1: Polynomial Methods -->
  <g transform="translate(20, 50)">
    <rect width="175" height="155" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="87" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Polynomial Methods</text>

    <!-- Mini cubic curve -->
    <g transform="translate(20, 40)">
      <path d="M 0 50 C 20 50 35 30 67 15 C 100 0 115 0 135 0" stroke="#2563eb" stroke-width="2" fill="none"/>
      <circle cx="0" cy="50" r="3" fill="#22c55e"/>
      <circle cx="135" cy="0" r="3" fill="#ef4444"/>
    </g>

    <text x="87" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">Cubic: 4 constraints</text>
    <text x="87" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">Quintic: 6 constraints</text>
    <text x="87" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#3b82f6">Good for point-to-point</text>
  </g>

  <!-- Column 2: Velocity Profiles -->
  <g transform="translate(212, 50)">
    <rect width="175" height="155" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="87" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Velocity Profiles</text>

    <!-- Mini trapezoid -->
    <g transform="translate(20, 45)">
      <path d="M 0 45 L 30 10 L 105 10 L 135 45" stroke="#22c55e" stroke-width="2" fill="none"/>
      <path d="M 0 45 L 30 10 L 105 10 L 135 45 Z" fill="#22c55e" fill-opacity="0.2"/>
    </g>

    <text x="87" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">Trapezoidal: Simple</text>
    <text x="87" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">S-Curve: Smooth</text>
    <text x="87" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">Respects motor limits</text>
  </g>

  <!-- Column 3: Multi-Segment -->
  <g transform="translate(405, 50)">
    <rect width="175" height="155" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="87" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Multi-Segment</text>

    <!-- Mini via points -->
    <g transform="translate(20, 40)">
      <path d="M 0 50 Q 35 20 67 25 Q 100 30 135 10" stroke="#f59e0b" stroke-width="2" fill="none"/>
      <circle cx="0" cy="50" r="4" fill="#22c55e"/>
      <circle cx="67" cy="25" r="3" fill="#f97316"/>
      <circle cx="135" cy="10" r="4" fill="#ef4444"/>
    </g>

    <text x="87" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">Via points / Waypoints</text>
    <text x="87" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">Cubic splines</text>
    <text x="87" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#b45309">Continuity at transitions</text>
  </g>

  <!-- Space comparison -->
  <g transform="translate(20, 220)">
    <rect width="270" height="85" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="135" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338ca">Planning Space</text>

    <g transform="translate(15, 35)">
      <rect width="110" height="40" rx="4" fill="#c7d2fe"/>
      <text x="55" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4338ca">Joint Space</text>
      <text x="55" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4338ca">Simple, no IK needed</text>
    </g>

    <g transform="translate(145, 35)">
      <rect width="110" height="40" rx="4" fill="#c7d2fe"/>
      <text x="55" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4338ca">Cartesian Space</text>
      <text x="55" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4338ca">Predictable path</text>
    </g>
  </g>

  <!-- Constraints box -->
  <g transform="translate(310, 220)">
    <rect width="270" height="85" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="135" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Always Check Constraints!</text>

    <text x="20" y="45" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">Position limits: qmin ≤ q(t) ≤ qmax</text>
    <text x="20" y="60" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">Velocity limits: |q'(t)| ≤ vmax</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">Torque limits: |τ(t)| ≤ τmax</text>
  </g>

  <!-- Key takeaways -->
  <rect x="20" y="320" width="560" height="65" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Key Takeaways</text>
  <text x="300" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">Path = geometry | Trajectory = path + timing | Smoothness matters for real motors</text>
  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">Choose method based on: precision needs, speed requirements, computational resources</text>
</svg>
