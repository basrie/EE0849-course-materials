<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="280" height="200" fill="#fafafa"/>

  <!-- Acceleration plot -->
  <g transform="translate(30, 20)">
    <text x="105" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f97316">Acceleration</text>

    <!-- Axes -->
    <line x1="0" y1="45" x2="220" y2="45" stroke="#333" stroke-width="1" marker-end="url(#arr3)"/>
    <line x1="0" y1="75" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arr3)"/>

    <!-- Step acceleration -->
    <line x1="0" y1="45" x2="0" y2="18" stroke="#f97316" stroke-width="2"/>
    <line x1="0" y1="18" x2="55" y2="18" stroke="#f97316" stroke-width="2"/>
    <line x1="55" y1="18" x2="55" y2="45" stroke="#f97316" stroke-width="2"/>
    <line x1="55" y1="45" x2="145" y2="45" stroke="#f97316" stroke-width="2"/>
    <line x1="145" y1="45" x2="145" y2="72" stroke="#f97316" stroke-width="2"/>
    <line x1="145" y1="72" x2="200" y2="72" stroke="#f97316" stroke-width="2"/>
    <line x1="200" y1="72" x2="200" y2="45" stroke="#f97316" stroke-width="2"/>

    <!-- Transition points -->
    <circle cx="0" cy="18" r="3" fill="#ef4444"/>
    <circle cx="55" cy="18" r="3" fill="#ef4444"/>
    <circle cx="145" cy="72" r="3" fill="#ef4444"/>
    <circle cx="200" cy="72" r="3" fill="#ef4444"/>
  </g>

  <!-- Jerk plot -->
  <g transform="translate(30, 110)">
    <text x="105" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">Jerk (infinite!)</text>

    <!-- Axes -->
    <line x1="0" y1="40" x2="220" y2="40" stroke="#333" stroke-width="1" marker-end="url(#arr3)"/>
    <line x1="0" y1="75" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arr3)"/>

    <!-- Impulses -->
    <line x1="0" y1="40" x2="0" y2="12" stroke="#dc2626" stroke-width="3"/>
    <polygon points="0,12 -3,18 3,18" fill="#dc2626"/>
    <text x="8" y="15" font-family="Arial, sans-serif" font-size="8" fill="#dc2626">+∞</text>

    <line x1="55" y1="40" x2="55" y2="68" stroke="#dc2626" stroke-width="3"/>
    <polygon points="55,68 52,62 58,62" fill="#dc2626"/>
    <text x="63" y="68" font-family="Arial, sans-serif" font-size="8" fill="#dc2626">−∞</text>

    <line x1="145" y1="40" x2="145" y2="68" stroke="#dc2626" stroke-width="3"/>
    <polygon points="145,68 142,62 148,62" fill="#dc2626"/>

    <line x1="200" y1="40" x2="200" y2="12" stroke="#dc2626" stroke-width="3"/>
    <polygon points="200,12 197,18 203,18" fill="#dc2626"/>

    <!-- Zero lines -->
    <line x1="1" y1="40" x2="54" y2="40" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="56" y1="40" x2="144" y2="40" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="146" y1="40" x2="199" y2="40" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>
</svg>
