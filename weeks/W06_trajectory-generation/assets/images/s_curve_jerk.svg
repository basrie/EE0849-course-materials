<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200">
  <defs>
    <marker id="arr4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="280" height="200" fill="#fafafa"/>

  <!-- Acceleration plot -->
  <g transform="translate(30, 20)">
    <text x="105" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f97316">Acceleration</text>

    <!-- Axes -->
    <line x1="0" y1="45" x2="220" y2="45" stroke="#333" stroke-width="1" marker-end="url(#arr4)"/>
    <line x1="0" y1="75" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arr4)"/>

    <!-- Smooth trapezoid acceleration -->
    <path d="M 0 45 L 18 18 L 37 18 L 55 45 L 145 45 L 163 72 L 182 72 L 200 45" stroke="#f97316" stroke-width="2" fill="none"/>

    <!-- Smooth transitions -->
    <circle cx="0" cy="45" r="3" fill="#22c55e"/>
    <circle cx="55" cy="45" r="3" fill="#22c55e"/>
    <circle cx="145" cy="45" r="3" fill="#22c55e"/>
    <circle cx="200" cy="45" r="3" fill="#22c55e"/>
  </g>

  <!-- Jerk plot -->
  <g transform="translate(30, 110)">
    <text x="105" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#22c55e">Jerk (bounded!)</text>

    <!-- Axes -->
    <line x1="0" y1="40" x2="220" y2="40" stroke="#333" stroke-width="1" marker-end="url(#arr4)"/>
    <line x1="0" y1="75" x2="0" y2="5" stroke="#333" stroke-width="1" marker-end="url(#arr4)"/>

    <!-- Bounded jerk pulses -->
    <line x1="0" y1="40" x2="0" y2="18" stroke="#22c55e" stroke-width="2"/>
    <line x1="0" y1="18" x2="18" y2="18" stroke="#22c55e" stroke-width="2"/>
    <line x1="18" y1="18" x2="18" y2="40" stroke="#22c55e" stroke-width="2"/>

    <line x1="18" y1="40" x2="37" y2="40" stroke="#22c55e" stroke-width="2"/>

    <line x1="37" y1="40" x2="37" y2="62" stroke="#22c55e" stroke-width="2"/>
    <line x1="37" y1="62" x2="55" y2="62" stroke="#22c55e" stroke-width="2"/>
    <line x1="55" y1="62" x2="55" y2="40" stroke="#22c55e" stroke-width="2"/>

    <line x1="55" y1="40" x2="145" y2="40" stroke="#22c55e" stroke-width="2"/>

    <line x1="145" y1="40" x2="145" y2="62" stroke="#22c55e" stroke-width="2"/>
    <line x1="145" y1="62" x2="163" y2="62" stroke="#22c55e" stroke-width="2"/>
    <line x1="163" y1="62" x2="163" y2="40" stroke="#22c55e" stroke-width="2"/>

    <line x1="163" y1="40" x2="182" y2="40" stroke="#22c55e" stroke-width="2"/>

    <line x1="182" y1="40" x2="182" y2="18" stroke="#22c55e" stroke-width="2"/>
    <line x1="182" y1="18" x2="200" y2="18" stroke="#22c55e" stroke-width="2"/>
    <line x1="200" y1="18" x2="200" y2="40" stroke="#22c55e" stroke-width="2"/>

    <!-- Labels -->
    <text x="-18" y="20" font-family="Arial, sans-serif" font-size="8" fill="#666">+j</text>
    <text x="-18" y="65" font-family="Arial, sans-serif" font-size="8" fill="#666">−j</text>
  </g>
</svg>
