<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSV color threshold pipeline</title>
<style>
  :root {
    --c-x: #d62828; --c-y: #2a9d3f; --c-z: #2f6ed3;
    --c-vec: #7b2cbf; --c-hl: #f39c12; --c-world: #666666;
    --c-free: #22c55e; --c-free-fill: #dcfce7;
    --c-occ: #ef4444; --c-occ-fill: #fecaca;
    --c-robot: #3b82f6; --c-robot-dark: #1e40af;
    --c-panel: #fafafa; --c-brd: #e2e8f0;
    --c-text: #1e293b; --c-muted: #64748b; --c-grid: #cbd5e1;
  }
  html, body {
    margin: 0; padding: 0; background: white;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--c-text);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
  }
  .stage {
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 8px; box-sizing: border-box;
  }
  .stage > svg, .stage > .container {
    width: 100%; height: 100%; max-width: 900px; max-height: 100%;
  }
  svg { display: block; }
  svg text { font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .controls {
    display: flex; gap: 12px; align-items: center; justify-content: center;
    padding: 6px 10px; font-size: 13px; color: var(--c-muted);
  }
  .controls input[type=range] { width: 220px; accent-color: #f39c12; }
  .controls .pill {
    background: var(--c-panel); border: 1px solid var(--c-brd);
    border-radius: 999px; padding: 4px 10px;
  }
</style>
</head>
<body>
<div class="stage"><svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Arial, sans-serif">
  <defs>
    <marker id="pipeArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="#64748b"/>
    </marker>
    <!-- Table texture -->
    <pattern id="tableTex" width="18" height="6" patternUnits="userSpaceOnUse">
      <rect width="18" height="6" fill="#a87b52"/>
      <line x1="0" y1="3" x2="18" y2="3" stroke="#8a6340" stroke-width="0.7"/>
    </pattern>
    <!-- HSV color wheel hint -->
    <radialGradient id="hueWheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>

  <!-- ========================= PANEL 1: Original ========================= -->
  <text x="105" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">1. Original (BGR)</text>

  <!-- Frame -->
  <rect x="30" y="30" width="150" height="150" rx="4" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- Sky / background gradient -->
  <rect x="31" y="31" width="148" height="90" fill="#cfe3f5"/>
  <!-- Table surface (textured brown) -->
  <rect x="31" y="121" width="148" height="58" fill="url(#tableTex)"/>
  <!-- Red ball (target) -->
  <circle cx="95" cy="110" r="20" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/>
  <!-- Ball highlight -->
  <ellipse cx="88" cy="103" rx="6" ry="4" fill="#fca5a5" fill-opacity="0.8"/>
  <!-- Green distractor (leaf / cup) -->
  <ellipse cx="140" cy="108" rx="14" ry="10" fill="#16a34a" stroke="#14532d" stroke-width="0.8"/>
  <!-- Gray distractor (box on table) -->
  <rect x="45" y="130" width="25" height="25" fill="#6b7280" stroke="#374151" stroke-width="1"/>
  <!-- Blue distractor -->
  <rect x="150" y="138" width="20" height="18" fill="#2563eb" stroke="#1e3a8a" stroke-width="0.8"/>
  <!-- Shadow under ball -->
  <ellipse cx="95" cy="130" rx="18" ry="3" fill="#000" fill-opacity="0.2"/>

  <!-- Caption under panel -->
  <text x="105" y="197" text-anchor="middle" font-size="10" fill="#475569">scene with target + distractors</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="105" x2="238" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#pipeArrow)"/>
  <text x="214" y="98" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">HSV</text>
  <text x="214" y="120" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">inRange</text>

  <!-- ========================= PANEL 2: Binary mask ========================= -->
  <text x="320" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">2. Binary mask</text>

  <!-- Frame (black background) -->
  <rect x="245" y="30" width="150" height="150" rx="4" fill="#111827" stroke="#374151" stroke-width="1.2"/>
  <!-- Main white region corresponding to the red ball -->
  <circle cx="310" cy="110" r="20" fill="#ffffff"/>
  <!-- Small ragged edge imperfections -->
  <circle cx="292" cy="101" r="2" fill="#ffffff"/>
  <circle cx="329" cy="117" r="1.5" fill="#ffffff"/>
  <circle cx="295" cy="122" r="1.2" fill="#ffffff"/>
  <!-- A couple of stray noise pixels (showing it's not perfect) -->
  <rect x="275" y="55" width="2" height="2" fill="#ffffff" opacity="0.7"/>
  <rect x="360" y="80" width="2" height="2" fill="#ffffff" opacity="0.7"/>
  <rect x="340" y="160" width="2" height="2" fill="#ffffff" opacity="0.7"/>

  <!-- Small HSV hue legend inset (bottom-right corner) -->
  <g transform="translate(357, 145)">
    <rect x="0" y="0" width="30" height="28" rx="2" fill="#1f2937" stroke="#374151" stroke-width="0.8"/>
    <text x="15" y="8" text-anchor="middle" font-size="6" fill="#9ca3af">HSV</text>
    <!-- thin hue bar -->
    <rect x="3" y="11" width="24" height="4" fill="url(#hueStrip)"/>
    <!-- Highlighted region for red (wraps around 0) -->
    <rect x="3" y="11" width="3" height="4" fill="none" stroke="#f87171" stroke-width="0.8"/>
    <rect x="24" y="11" width="3" height="4" fill="none" stroke="#f87171" stroke-width="0.8"/>
    <text x="15" y="24" text-anchor="middle" font-size="6" fill="#f87171">H &#8712; red band</text>
  </g>
  <defs>
    <linearGradient id="hueStrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ef4444"/>
      <stop offset="17%"  stop-color="#f59e0b"/>
      <stop offset="33%"  stop-color="#eab308"/>
      <stop offset="50%"  stop-color="#22c55e"/>
      <stop offset="67%"  stop-color="#06b6d4"/>
      <stop offset="83%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Caption -->
  <text x="320" y="197" text-anchor="middle" font-size="10" fill="#475569">white = in red band, black = not</text>

  <!-- Arrow 2 -->
  <line x1="405" y1="105" x2="453" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#pipeArrow)"/>
  <text x="430" y="98" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">find</text>
  <text x="430" y="120" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">Contours</text>

  <!-- ========================= PANEL 3: Contour + centroid ========================= -->
  <text x="535" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">3. Contour &amp; centroid</text>

  <rect x="460" y="30" width="150" height="150" rx="4" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- Same scene -->
  <rect x="461" y="31" width="148" height="90" fill="#cfe3f5"/>
  <rect x="461" y="121" width="148" height="58" fill="url(#tableTex)"/>
  <ellipse cx="570" cy="108" rx="14" ry="10" fill="#16a34a" stroke="#14532d" stroke-width="0.8" opacity="0.5"/>
  <rect x="475" y="130" width="25" height="25" fill="#6b7280" stroke="#374151" stroke-width="1" opacity="0.5"/>
  <rect x="580" y="138" width="20" height="18" fill="#2563eb" stroke="#1e3a8a" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="525" cy="130" rx="18" ry="3" fill="#000" fill-opacity="0.2"/>
  <circle cx="525" cy="110" r="20" fill="#dc2626" stroke="#7f1d1d" stroke-width="1" opacity="0.85"/>

  <!-- Green contour (bold outline) -->
  <circle cx="525" cy="110" r="22" fill="none" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Bounding box -->
  <rect x="503" y="88" width="44" height="44" fill="none" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Centroid cross -->
  <line x1="518" y1="110" x2="532" y2="110" stroke="#f39c12" stroke-width="1.8"/>
  <line x1="525" y1="103" x2="525" y2="117" stroke="#f39c12" stroke-width="1.8"/>
  <circle cx="525" cy="110" r="2" fill="#f39c12"/>

  <!-- Centroid label -->
  <text x="555" y="75" font-size="9" fill="#b45309" font-weight="bold">(cx, cy)</text>
  <line x1="551" y1="79" x2="528" y2="108" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- Caption -->
  <text x="535" y="197" text-anchor="middle" font-size="10" fill="#475569">robot steers toward (cx, cy)</text>

  <!-- ========================= Footer pipeline label ========================= -->
  <line x1="30" y1="225" x2="610" y2="225" stroke="#cbd5e1" stroke-width="1"/>
  <text x="320" y="243" text-anchor="middle" font-size="11" fill="#475569"><tspan font-weight="bold">Pipeline:</tspan> cvtColor &#8594; inRange &#8594; findContours &#8594; boundingRect / moments</text>

  <!-- Step numbers under panels (reinforce flow) -->
  <g font-size="12" font-weight="bold" fill="#2f6ed3">
    <text x="105" y="217" text-anchor="middle">&#9312;</text>
    <text x="320" y="217" text-anchor="middle">&#9313;</text>
    <text x="535" y="217" text-anchor="middle">&#9314;</text>
  </g>
</svg></div>

</body>
</html>
