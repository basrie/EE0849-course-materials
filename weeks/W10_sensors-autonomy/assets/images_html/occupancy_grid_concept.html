<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Occupancy grid concept</title>
<style>
  :root {
    --c-x: #d62828; --c-y: #2a9d3f; --c-z: #2f6ed3;
    --c-vec: #7b2cbf; --c-hl: #f39c12; --c-world: #666666;
    --c-free: #22c55e; --c-free-fill: #dcfce7;
    --c-occ: #ef4444; --c-occ-fill: #fecaca;
    --c-robot: #3b82f6; --c-robot-dark: #1e40af;
    --c-panel: #fafafa; --c-brd: #e2e8f0;
    --c-text: #1e293b; --c-muted: #64748b; --c-grid: #cbd5e1;
  }
  html, body {
    margin: 0; padding: 0; background: white;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--c-text);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
  }
  .stage {
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 8px; box-sizing: border-box;
  }
  .stage > svg, .stage > .container {
    width: 100%; height: 100%; max-width: 780px; max-height: 100%;
  }
  svg { display: block; }
  svg text { font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .controls {
    display: flex; gap: 12px; align-items: center; justify-content: center;
    padding: 6px 10px; font-size: 13px; color: var(--c-muted);
  }
  .controls input[type=range] { width: 220px; accent-color: #f39c12; }
  .controls .pill {
    background: var(--c-panel); border: 1px solid var(--c-brd);
    border-radius: 999px; padding: 4px 10px;
  }
</style>
</head>
<body>
<div class="stage">
<div class="container" id="og-root">
  <svg viewBox="0 0 600 460" preserveAspectRatio="xMidYMid meet">
    <text x="300" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Occupancy grid: click cells to cycle Free → Unknown → Occupied</text>
    <g id="cells"></g>
    <g id="legend">
      <rect x="40" y="420" width="20" height="20" fill="#dcfce7" stroke="#22c55e"/>
      <text x="68" y="435" font-size="12" fill="#475569">Free (l &lt; 0)</text>
      <rect x="200" y="420" width="20" height="20" fill="#e5e7eb" stroke="#9ca3af"/>
      <text x="228" y="435" font-size="12" fill="#475569">Unknown (l = 0)</text>
      <rect x="380" y="420" width="20" height="20" fill="#fecaca" stroke="#ef4444"/>
      <text x="408" y="435" font-size="12" fill="#475569">Occupied (l &gt; 0)</text>
    </g>
  </svg>
</div>
</div>

<script>
(function(){
  const X0=40, Y0=44, S=36, COLS=14, ROWS=10;
  const states = [
    {f:'#dcfce7', s:'#22c55e', label:''},
    {f:'#e5e7eb', s:'#9ca3af', label:'?'},
    {f:'#fecaca', s:'#ef4444', label:''},
  ];
  // initial pattern: a U-shaped occupied wall, free interior
  function initState(i,j){
    const onWall = (i===2 && j>=2 && j<=7) || (j===7 && i>=2 && i<=11) || (i===11 && j>=2 && j<=7);
    if(onWall) return 2;
    if(i>2 && i<11 && j>2 && j<7) return 0;
    return 1;
  }
  const grid=document.getElementById('cells');
  const cells=[];
  for(let i=0;i<COLS;i++){ cells[i]=[];
    for(let j=0;j<ROWS;j++){
      const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
      const px=X0+i*S, py=Y0+j*S;
      r.setAttribute('x',px); r.setAttribute('y',py);
      r.setAttribute('width',S); r.setAttribute('height',S);
      r.setAttribute('stroke-width','1');
      r.style.cursor='pointer';
      let st = initState(i,j);
      function paint(){ r.setAttribute('fill', states[st].f); r.setAttribute('stroke', states[st].s); }
      paint();
      r.addEventListener('click', ()=>{ st=(st+1)%3; paint(); });
      grid.appendChild(r);
      cells[i][j]=r;
    }
  }
})();
</script>

</body>
</html>
