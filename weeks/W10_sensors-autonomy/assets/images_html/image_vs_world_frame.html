<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image frame vs world frame</title>
<style>
  :root {
    --c-x: #d62828; --c-y: #2a9d3f; --c-z: #2f6ed3;
    --c-vec: #7b2cbf; --c-hl: #f39c12; --c-world: #666666;
    --c-free: #22c55e; --c-free-fill: #dcfce7;
    --c-occ: #ef4444; --c-occ-fill: #fecaca;
    --c-robot: #3b82f6; --c-robot-dark: #1e40af;
    --c-panel: #fafafa; --c-brd: #e2e8f0;
    --c-text: #1e293b; --c-muted: #64748b; --c-grid: #cbd5e1;
  }
  html, body {
    margin: 0; padding: 0; background: white;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--c-text);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
  }
  .stage {
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 8px; box-sizing: border-box;
  }
  .stage > svg, .stage > .container {
    width: 100%; height: 100%; max-width: 900px; max-height: 100%;
  }
  svg { display: block; }
  svg text { font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .controls {
    display: flex; gap: 12px; align-items: center; justify-content: center;
    padding: 6px 10px; font-size: 13px; color: var(--c-muted);
  }
  .controls input[type=range] { width: 220px; accent-color: #f39c12; }
  .controls .pill {
    background: var(--c-panel); border: 1px solid var(--c-brd);
    border-radius: 999px; padding: 4px 10px;
  }
</style>
</head>
<body>
<div class="stage"><svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 220" font-family="Arial, sans-serif">
  <!-- Left Panel: Image Frame -->
  <rect x="20" y="20" width="200" height="170" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="120" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Image Frame (u, v)</text>

  <!-- Image rectangle -->
  <rect x="50" y="50" width="130" height="100" fill="#eef2ff" stroke="#94a3b8" stroke-width="1"/>

  <!-- Origin dot -->
  <circle cx="50" cy="50" r="3" fill="#334155"/>
  <text x="40" y="45" text-anchor="end" font-size="10" fill="#334155">O</text>

  <!-- u arrow (right) -->
  <line x1="50" y1="50" x2="110" y2="50" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="80" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">u</text>

  <!-- v arrow (down) -->
  <line x1="50" y1="50" x2="50" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="40" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">v</text>

  <!-- Red pixel dot -->
  <circle cx="130" cy="100" r="4" fill="#d62828"/>
  <text x="138" y="96" font-size="10" fill="#d62828">(u, v)</text>

  <!-- Right Panel: World Frame -->
  <rect x="330" y="20" width="200" height="170" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="430" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">World Frame (x, y, z)</text>

  <!-- Origin -->
  <circle cx="390" cy="140" r="3" fill="#334155"/>
  <text x="380" y="148" text-anchor="end" font-size="10" fill="#334155">O</text>

  <!-- x axis (red, going right) -->
  <line x1="390" y1="140" x2="470" y2="140" stroke="#d62828" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="475" y="144" font-size="11" font-weight="bold" fill="#d62828">x</text>

  <!-- y axis (green, going up-right) -->
  <line x1="390" y1="140" x2="440" y2="90" stroke="#2a9d3f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="446" y="88" font-size="11" font-weight="bold" fill="#2a9d3f">y</text>

  <!-- z axis (blue, going up) -->
  <line x1="390" y1="140" x2="390" y2="60" stroke="#2f6ed3" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="396" y="56" font-size="11" font-weight="bold" fill="#2f6ed3">z</text>

  <!-- Orange point in 3D space -->
  <circle cx="455" cy="75" r="4" fill="#f39c12"/>
  <text x="463" y="72" font-size="10" fill="#f39c12">(x, y, z)</text>

  <!-- Dashed arrow between panels -->
  <line x1="228" y1="105" x2="322" y2="105" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowDash)"/>
  <text x="275" y="98" text-anchor="middle" font-size="10" fill="#64748b">Projection</text>
  <text x="275" y="120" text-anchor="middle" font-size="9" fill="#94a3b8">(loses depth)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#d62828" stroke-width="1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#2a9d3f" stroke-width="1"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#2f6ed3" stroke-width="1"/>
    </marker>
    <marker id="arrowDash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1"/>
    </marker>
  </defs>
</svg></div>

</body>
</html>
