<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrRight" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
    <marker id="arrLeft" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#ef4444"/>
    </marker>
    <marker id="dimEnd" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#334155"/>
    </marker>
    <marker id="dimStart" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#334155"/>
    </marker>
    <!-- Subtle wave pattern -->
    <pattern id="wallHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ================ TOP PANEL: Spatial view ================ -->
  <text x="260" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Spatial view</text>

  <!-- LiDAR unit body -->
  <rect x="35" y="50" width="70" height="55" rx="4" fill="#dbeafe" stroke="#2f6ed3" stroke-width="2"/>
  <!-- Internal components: emitter + detector -->
  <circle cx="95" cy="65" r="4" fill="#ef4444"/>   <!-- emitter (red dot) -->
  <circle cx="95" cy="90" r="4" fill="#16a34a"/>   <!-- detector (green dot) -->
  <text x="45" y="72" font-size="8" fill="#64748b">emit</text>
  <text x="45" y="95" font-size="8" fill="#64748b">detect</text>
  <text x="70" y="125" text-anchor="middle" font-size="11" fill="#1e3a5f" font-weight="600">LiDAR</text>

  <!-- Surface (wall) with hatch fill -->
  <rect x="415" y="35" width="14" height="90" fill="url(#wallHatch)" stroke="#475569" stroke-width="1.5"/>
  <text x="422" y="142" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">surface</text>

  <!-- Outgoing pulse line -->
  <line x1="103" y1="65" x2="405" y2="65" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arrRight)"/>
  <!-- Mini waveform on outgoing pulse -->
  <path d="M215,65 Q222,54 229,65 Q236,76 243,65 Q250,54 257,65" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="258" y="56" font-size="10" fill="#ef4444" font-weight="bold">laser pulse</text>

  <!-- Impact burst on surface -->
  <g transform="translate(415, 65)">
    <line x1="-4" y1="-6" x2="-12" y2="-10" stroke="#f39c12" stroke-width="1.2"/>
    <line x1="-4" y1="0"  x2="-14" y2="0"   stroke="#f39c12" stroke-width="1.2"/>
    <line x1="-4" y1="6"  x2="-12" y2="10"  stroke="#f39c12" stroke-width="1.2"/>
  </g>

  <!-- Returning reflected pulse -->
  <line x1="405" y1="90" x2="103" y2="90" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrLeft)"/>
  <path d="M300,90 Q293,79 286,90 Q279,101 272,90" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
  <text x="258" y="108" font-size="10" fill="#ef4444" font-style="italic">reflected pulse</text>

  <!-- Distance dimension line -->
  <line x1="105" y1="150" x2="415" y2="150" stroke="#334155" stroke-width="1" marker-end="url(#dimEnd)" marker-start="url(#dimStart)"/>
  <text x="260" y="144" text-anchor="middle" font-size="13" fill="#334155" font-weight="bold" font-style="italic">d</text>
  <!-- Tick marks -->
  <line x1="105" y1="108" x2="105" y2="155" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="415" y1="125" x2="415" y2="155" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- ================ BOTTOM PANEL: Temporal view ================ -->
  <text x="260" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Temporal view (inside the LiDAR)</text>

  <!-- Timeline axis -->
  <line x1="65" y1="245" x2="465" y2="245" stroke="#334155" stroke-width="1.3" marker-end="url(#dimEnd)"/>
  <text x="470" y="249" font-size="11" font-style="italic" fill="#334155">time</text>

  <!-- Origin tick -->
  <line x1="95" y1="240" x2="95" y2="250" stroke="#334155" stroke-width="1"/>
  <text x="95" y="265" text-anchor="middle" font-size="10" fill="#334155">t = 0</text>
  <text x="95" y="278" text-anchor="middle" font-size="9" fill="#64748b">(emit)</text>

  <!-- Return tick -->
  <line x1="380" y1="240" x2="380" y2="250" stroke="#334155" stroke-width="1"/>
  <text x="380" y="265" text-anchor="middle" font-size="10" fill="#334155">t = &#x394;t</text>
  <text x="380" y="278" text-anchor="middle" font-size="9" fill="#64748b">(detect)</text>

  <!-- Outgoing pulse spike at t=0 -->
  <rect x="91" y="210" width="8" height="30" fill="#ef4444"/>
  <text x="95" y="204" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="bold">out</text>

  <!-- Returning pulse spike at t=Δt -->
  <rect x="376" y="215" width="8" height="25" fill="#ef4444" opacity="0.7"/>
  <text x="380" y="209" text-anchor="middle" font-size="10" fill="#ef4444" font-weight="bold">in</text>

  <!-- Δt span -->
  <line x1="100" y1="225" x2="376" y2="225" stroke="#f39c12" stroke-width="1.5" marker-start="url(#dimStart)" marker-end="url(#dimEnd)" opacity="0.7"/>
  <text x="238" y="220" text-anchor="middle" font-size="11" fill="#b45309" font-weight="bold" font-style="italic">&#x394;t</text>

  <!-- ================ Formula + example ================ -->
  <rect x="55" y="289" width="410" height="24" rx="4" fill="#fef3c7" stroke="#f39c12" stroke-width="1"/>
  <text x="90" y="306" font-size="12" fill="#1e293b" font-weight="bold" font-style="italic">d = c &#183; &#x394;t / 2</text>
  <text x="210" y="306" font-size="10" fill="#475569">&#8594; 1 m round-trip = 6.67 ns, so timing must be very precise.</text>
</svg>
