<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="#475569"/>
    </marker>
    <marker id="arrowhead-dash" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="#64748b"/>
    </marker>
    <!-- Small hatch used in grid mini-icon -->
    <pattern id="miniHatch" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="4" stroke="#c7d2fe" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#c7d2fe" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Title -->
  <text x="380" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Autonomous Navigation Pipeline</text>

  <!-- =========================== BOX 1: Sense =========================== -->
  <rect x="25" y="38" width="130" height="80" rx="8" fill="#dbeafe" stroke="#2f6ed3" stroke-width="2"/>
  <text x="90" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Sense</text>

  <!-- Mini LiDAR icon: small box with radiating beams -->
  <g transform="translate(90, 82)">
    <!-- beams -->
    <g stroke="#ef4444" stroke-width="1" opacity="0.8">
      <line x1="0" y1="0" x2="-18" y2="-10"/>
      <line x1="0" y1="0" x2="-18" y2="0"/>
      <line x1="0" y1="0" x2="-18" y2="10"/>
      <line x1="0" y1="0" x2="18" y2="-10"/>
      <line x1="0" y1="0" x2="18" y2="0"/>
      <line x1="0" y1="0" x2="18" y2="10"/>
      <line x1="0" y1="0" x2="0" y2="-14"/>
    </g>
    <!-- sensor body -->
    <rect x="-8" y="-6" width="16" height="12" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="2.5" fill="#ef4444"/>
  </g>

  <text x="90" y="110" text-anchor="middle" font-size="9" fill="#475569">LiDAR, Camera, IMU</text>
  <text x="90" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f6ed3">W10</text>

  <!-- =========================== BOX 2: Map =========================== -->
  <rect x="175" y="38" width="130" height="80" rx="8" fill="#dbeafe" stroke="#2f6ed3" stroke-width="2"/>
  <text x="240" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Map</text>

  <!-- Mini occupancy grid icon: 5x3 cells, some filled -->
  <g transform="translate(215, 70)">
    <rect x="0" y="0" width="50" height="30" fill="url(#miniHatch)" stroke="#94a3b8" stroke-width="0.6"/>
    <!-- grid lines -->
    <g stroke="#c7d2fe" stroke-width="0.5">
      <line x1="10" y1="0" x2="10" y2="30"/>
      <line x1="20" y1="0" x2="20" y2="30"/>
      <line x1="30" y1="0" x2="30" y2="30"/>
      <line x1="40" y1="0" x2="40" y2="30"/>
      <line x1="0" y1="10" x2="50" y2="10"/>
      <line x1="0" y1="20" x2="50" y2="20"/>
    </g>
    <!-- occupied cells (black) -->
    <rect x="20" y="0" width="10" height="10" fill="#1e293b"/>
    <rect x="30" y="0" width="10" height="10" fill="#1e293b"/>
    <rect x="40" y="10" width="10" height="10" fill="#1e293b"/>
    <rect x="0" y="20" width="10" height="10" fill="#1e293b"/>
    <!-- free cells (white) already hatched -->
  </g>

  <text x="240" y="110" text-anchor="middle" font-size="9" fill="#475569">Occupancy Grid</text>
  <text x="240" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f6ed3">W10</text>

  <!-- =========================== BOX 3: Plan =========================== -->
  <rect x="325" y="38" width="130" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Plan</text>

  <!-- Mini path icon: graph with start, goal, and path -->
  <g transform="translate(390, 82)">
    <!-- obstacles (gray squares) -->
    <rect x="-15" y="-8" width="8" height="8" fill="#9ca3af" opacity="0.6"/>
    <rect x="5" y="0" width="8" height="8" fill="#9ca3af" opacity="0.6"/>
    <!-- start node -->
    <circle cx="-22" cy="6" r="3" fill="#22c55e" stroke="#14532d" stroke-width="0.8"/>
    <!-- goal node -->
    <circle cx="22" cy="-8" r="3" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.8"/>
    <!-- path polyline -->
    <polyline points="-22,6 -18,2 -4,4 0,-4 14,-6 22,-8"
              fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- S / G labels -->
    <text x="-22" y="16" text-anchor="middle" font-size="6" fill="#15803d" font-weight="bold">S</text>
    <text x="22" y="-14" text-anchor="middle" font-size="6" fill="#b91c1c" font-weight="bold">G</text>
  </g>

  <text x="390" y="110" text-anchor="middle" font-size="9" fill="#475569">Dijkstra, A*, RRT</text>
  <text x="390" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#16a34a">W11&#8211;12</text>

  <!-- =========================== BOX 4: Execute =========================== -->
  <rect x="475" y="38" width="130" height="80" rx="8" fill="#fef3c7" stroke="#f39c12" stroke-width="2"/>
  <text x="540" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Execute</text>

  <!-- Mini wheeled-robot icon -->
  <g transform="translate(540, 82)">
    <!-- chassis -->
    <rect x="-18" y="-7" width="36" height="12" rx="2" fill="#f59e0b" stroke="#92400e" stroke-width="0.8"/>
    <!-- sensor eye on front -->
    <circle cx="14" cy="-1" r="2" fill="#1e293b"/>
    <!-- wheels -->
    <circle cx="-11" cy="7" r="4" fill="#1f2937" stroke="#0f172a" stroke-width="0.8"/>
    <circle cx="11" cy="7" r="4" fill="#1f2937" stroke="#0f172a" stroke-width="0.8"/>
    <circle cx="-11" cy="7" r="1.3" fill="#f3f4f6"/>
    <circle cx="11" cy="7" r="1.3" fill="#f3f4f6"/>
    <!-- motion arrow -->
    <line x1="0" y1="-13" x2="16" y2="-13" stroke="#92400e" stroke-width="1" marker-end="url(#arrowhead)"/>
  </g>

  <text x="540" y="110" text-anchor="middle" font-size="9" fill="#475569">Kinematic Model</text>
  <text x="540" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#f39c12">W09</text>

  <!-- =========================== BOX 5: Localize =========================== -->
  <rect x="625" y="38" width="130" height="80" rx="8" fill="#f3e8ff" stroke="#7b2cbf" stroke-width="2"/>
  <text x="690" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Localize</text>

  <!-- Mini particle-filter icon: robot + scattered probability particles -->
  <g transform="translate(690, 82)">
    <!-- particles (small dots) -->
    <g fill="#7b2cbf" opacity="0.55">
      <circle cx="-18" cy="-5" r="1.4"/>
      <circle cx="-14" cy="3" r="1.4"/>
      <circle cx="-8"  cy="-2" r="1.8"/>
      <circle cx="-2"  cy="6" r="1.4"/>
      <circle cx="3"   cy="-6" r="1.4"/>
      <circle cx="9"   cy="-1" r="1.6"/>
      <circle cx="14"  cy="5" r="1.4"/>
      <circle cx="19"  cy="-4" r="1.4"/>
      <circle cx="-5"  cy="-8" r="1.2"/>
      <circle cx="6"   cy="8" r="1.2"/>
    </g>
    <!-- mean-estimate robot in center -->
    <polygon points="0,-6 6,4 0,2 -6,4" fill="#7b2cbf" stroke="#4c1d95" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#7b2cbf" stroke-width="0.6" stroke-dasharray="2,2" opacity="0.6"/>
  </g>

  <text x="690" y="110" text-anchor="middle" font-size="9" fill="#475569">Particle Filter / SLAM</text>
  <text x="690" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#7b2cbf">W13</text>

  <!-- =========================== Arrows between boxes =========================== -->
  <line x1="155" y1="78" x2="173" y2="78" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="305" y1="78" x2="323" y2="78" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="455" y1="78" x2="473" y2="78" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="605" y1="78" x2="623" y2="78" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Loop-back arrow: Localize -> Sense (curves under the boxes) -->
  <path d="M 690 118 L 690 175 Q 690 190 675 190 L 105 190 Q 90 190 90 175 L 90 120"
        fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6,4"
        marker-end="url(#arrowhead-dash)"/>
  <text x="380" y="205" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">new sensor data updates map &amp; pose &#8594; replan</text>
</svg>
