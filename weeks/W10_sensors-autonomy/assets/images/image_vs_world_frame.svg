<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 220" width="550" height="220" font-family="Arial, sans-serif">
  <!-- Left Panel: World Frame (3D) -->
  <rect x="20" y="20" width="200" height="170" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="120" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">World Frame (x, y, z)</text>

  <!-- Origin -->
  <circle cx="80" cy="140" r="3" fill="#334155"/>
  <text x="70" y="148" text-anchor="end" font-size="10" fill="#334155">O</text>

  <!-- x axis (red, right) -->
  <line x1="80" y1="140" x2="160" y2="140" stroke="#d62828" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="165" y="144" font-size="11" font-weight="bold" fill="#d62828">x</text>

  <!-- y axis (green, up-right) -->
  <line x1="80" y1="140" x2="130" y2="90" stroke="#2a9d3f" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="136" y="88" font-size="11" font-weight="bold" fill="#2a9d3f">y</text>

  <!-- z axis (blue, up) -->
  <line x1="80" y1="140" x2="80" y2="60" stroke="#2f6ed3" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="86" y="56" font-size="11" font-weight="bold" fill="#2f6ed3">z</text>

  <!-- Orange 3D point -->
  <circle cx="145" cy="75" r="4" fill="#f39c12"/>
  <text x="153" y="72" font-size="10" fill="#f39c12">(x, y, z)</text>

  <!-- Right Panel: Image Frame (2D) -->
  <rect x="330" y="20" width="200" height="170" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="430" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Image Frame (u, v)</text>

  <!-- Image rectangle -->
  <rect x="360" y="50" width="130" height="100" fill="#eef2ff" stroke="#94a3b8" stroke-width="1"/>

  <!-- Origin dot -->
  <circle cx="360" cy="50" r="3" fill="#334155"/>
  <text x="350" y="45" text-anchor="end" font-size="10" fill="#334155">O</text>

  <!-- u arrow (right) -->
  <line x1="360" y1="50" x2="420" y2="50" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="390" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">u</text>

  <!-- v arrow (down) -->
  <line x1="360" y1="50" x2="360" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="350" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748b">v</text>

  <!-- Red pixel dot -->
  <circle cx="440" cy="100" r="4" fill="#d62828"/>
  <text x="448" y="96" font-size="10" fill="#d62828">(u, v)</text>

  <!-- Dashed arrow between panels (world -> image) -->
  <line x1="228" y1="105" x2="322" y2="105" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowDash)"/>
  <text x="275" y="98" text-anchor="middle" font-size="10" fill="#64748b">Projection</text>
  <text x="275" y="120" text-anchor="middle" font-size="9" fill="#94a3b8">(loses depth)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#d62828" stroke-width="1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#2a9d3f" stroke-width="1"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#2f6ed3" stroke-width="1"/>
    </marker>
    <marker id="arrowDash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#94a3b8" stroke-width="1"/>
    </marker>
  </defs>
</svg>
