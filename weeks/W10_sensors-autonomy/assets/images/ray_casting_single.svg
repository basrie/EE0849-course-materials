<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Grid origin offset -->
  <g transform="translate(60, 40)">

    <!--
      Ray from robot cell (1,4) center (60,180) to hit cell (5,1) center (220,60).
      In cell coords: from (1.5, 4.5) to (5.5, 1.5). Slope = -3/4.
      Cells visited (Bresenham/supercover):
        (1,4) robot, (2,4), (2,3), (3,3), (3,2), (4,2), (4,1), (5,1) hit.
      No 4-way corner crossings — ray enters every cell through a face.
    -->

    <!-- Free cells along ray path -->
    <rect x="80"  y="160" width="40" height="40" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
    <rect x="80"  y="120" width="40" height="40" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
    <rect x="120" y="120" width="40" height="40" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
    <rect x="120" y="80"  width="40" height="40" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
    <rect x="160" y="80"  width="40" height="40" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
    <rect x="160" y="40"  width="40" height="40" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>

    <!-- Occupied cell (endpoint) - red -->
    <rect x="200" y="40"  width="40" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Grid lines -->
    <line x1="0"   y1="0" x2="0"   y2="320" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="40"  y1="0" x2="40"  y2="320" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="80"  y1="0" x2="80"  y2="320" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="320" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="320" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="320" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="280" y1="0" x2="280" y2="320" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="320" stroke="#cccccc" stroke-width="0.5"/>

    <line x1="0" y1="0"   x2="320" y2="0"   stroke="#cccccc" stroke-width="0.5"/>
    <line x1="0" y1="40"  x2="320" y2="40"  stroke="#cccccc" stroke-width="0.5"/>
    <line x1="0" y1="80"  x2="320" y2="80"  stroke="#cccccc" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="320" y2="120" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="320" y2="160" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="320" y2="200" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="320" y2="240" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="320" y2="280" stroke="#cccccc" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="320" y2="320" stroke="#cccccc" stroke-width="0.5"/>

    <!-- "F" labels on free cells -->
    <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">F</text>
    <text x="100" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">F</text>
    <text x="140" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">F</text>
    <text x="140" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">F</text>
    <text x="180" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">F</text>
    <text x="180" y="65"  text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a">F</text>

    <!-- "O" label on occupied cell -->
    <text x="220" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#dc2626">O</text>

    <!-- Dashed red ray: robot center (60,180) to endpoint center (220,60) -->
    <line x1="60" y1="180" x2="220" y2="60" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3"/>

    <!-- Robot at (1, 4) -->
    <circle cx="60" cy="180" r="8" fill="#3b82f6" stroke="#1e40af" stroke-width="1.2"/>
    <text x="60" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1e40af">Robot</text>

    <!-- Annotation: "Ray passes through → Free" -->
    <line x1="295" y1="155" x2="165" y2="100" stroke="#555" stroke-width="0.8" marker-end="url(#arrowhead)"/>
    <text x="300" y="150" font-family="Arial, sans-serif" font-size="10" fill="#333">Ray passes</text>
    <text x="300" y="163" font-family="Arial, sans-serif" font-size="10" fill="#333">through</text>
    <text x="300" y="178" font-family="Arial, sans-serif" font-size="10" fill="#16a34a" font-weight="bold">&#8594; Free</text>

    <!-- Annotation: "Ray endpoint → Occupied" -->
    <line x1="295" y1="40" x2="235" y2="55" stroke="#555" stroke-width="0.8" marker-end="url(#arrowhead)"/>
    <text x="300" y="28" font-family="Arial, sans-serif" font-size="10" fill="#333">Ray endpoint</text>
    <text x="300" y="43" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" font-weight="bold">&#8594; Occupied</text>

    <!-- Column indices -->
    <text x="20"  y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">0</text>
    <text x="60"  y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">1</text>
    <text x="100" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">2</text>
    <text x="140" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">3</text>
    <text x="180" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">4</text>
    <text x="220" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">5</text>
    <text x="260" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">6</text>
    <text x="300" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">7</text>

    <!-- Row indices (y-up on screen) -->
    <text x="-8" y="24"  text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">7</text>
    <text x="-8" y="64"  text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">6</text>
    <text x="-8" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">5</text>
    <text x="-8" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">4</text>
    <text x="-8" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">3</text>
    <text x="-8" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">2</text>
    <text x="-8" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">1</text>
    <text x="-8" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#999">0</text>

  </g>
</svg>
