<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="#64748b"/>
    </marker>
    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Sense&#8211;Plan&#8211;Act: the autonomy loop</text>

  <!-- =================== Curved arrows =================== -->
  <path d="M 320,105 C 390,115 425,170 395,220"
        fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 310,275 C 280,315 210,315 180,275"
        fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 95,220 C 65,170 100,115 170,105"
        fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- =================== SENSE node (top-center, highlighted) =================== -->
  <g>
    <rect x="175" y="55" width="170" height="60" rx="8" fill="#dbeafe" stroke="#2f6ed3" stroke-width="3"/>
    <!-- Eye icon -->
    <g transform="translate(205, 85)">
      <!-- outer eye shape (almond) -->
      <path d="M -16,0 C -10,-10 10,-10 16,0 C 10,10 -10,10 -16,0 Z"
            fill="#ffffff" stroke="#1e40af" stroke-width="1.5"/>
      <!-- iris -->
      <circle cx="0" cy="0" r="6" fill="#2f6ed3"/>
      <!-- pupil -->
      <circle cx="0" cy="0" r="3" fill="#0f172a"/>
      <!-- highlight -->
      <circle cx="-1.8" cy="-1.8" r="1.2" fill="#ffffff"/>
      <!-- scan lines showing active sensing -->
      <line x1="-22" y1="-6" x2="-28" y2="-10" stroke="#2f6ed3" stroke-width="1" opacity="0.6"/>
      <line x1="-22" y1="6" x2="-28" y2="10" stroke="#2f6ed3" stroke-width="1" opacity="0.6"/>
      <line x1="22" y1="-6" x2="28" y2="-10" stroke="#2f6ed3" stroke-width="1" opacity="0.6"/>
      <line x1="22" y1="6" x2="28" y2="10" stroke="#2f6ed3" stroke-width="1" opacity="0.6"/>
    </g>
    <text x="285" y="93" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e40af">SENSE</text>
  </g>
  <text x="260" y="135" text-anchor="middle" font-size="11" fill="#2f6ed3">W10: Sensors &amp; Maps</text>

  <!-- =================== PLAN node (bottom-right) =================== -->
  <g>
    <rect x="315" y="220" width="170" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <!-- Graph/brain icon: small graph with shortest path highlighted -->
    <g transform="translate(345, 250)">
      <!-- edges -->
      <g stroke="#14532d" stroke-width="0.8" opacity="0.5">
        <line x1="-16" y1="-8" x2="-4" y2="-12"/>
        <line x1="-16" y1="-8" x2="-6" y2="4"/>
        <line x1="-4" y1="-12" x2="8" y2="-8"/>
        <line x1="-4" y1="-12" x2="4" y2="2"/>
        <line x1="-6" y1="4" x2="4" y2="2"/>
        <line x1="-6" y1="4" x2="10" y2="10"/>
        <line x1="4" y1="2" x2="10" y2="10"/>
        <line x1="8" y1="-8" x2="16" y2="0"/>
        <line x1="4" y1="2" x2="16" y2="0"/>
      </g>
      <!-- shortest path highlighted -->
      <polyline points="-16,-8 -4,-12 8,-8 16,0" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round"/>
      <!-- nodes -->
      <circle cx="-16" cy="-8" r="3" fill="#22c55e" stroke="#14532d" stroke-width="0.8"/>
      <circle cx="-4" cy="-12" r="2.5" fill="#dcfce7" stroke="#14532d" stroke-width="0.8"/>
      <circle cx="-6" cy="4" r="2.5" fill="#dcfce7" stroke="#14532d" stroke-width="0.8"/>
      <circle cx="8" cy="-8" r="2.5" fill="#dcfce7" stroke="#14532d" stroke-width="0.8"/>
      <circle cx="4" cy="2" r="2.5" fill="#dcfce7" stroke="#14532d" stroke-width="0.8"/>
      <circle cx="10" cy="10" r="2.5" fill="#dcfce7" stroke="#14532d" stroke-width="0.8"/>
      <circle cx="16" cy="0" r="3" fill="#dc2626" stroke="#7f1d1d" stroke-width="0.8"/>
    </g>
    <text x="420" y="258" text-anchor="middle" font-size="18" font-weight="bold" fill="#15803d">PLAN</text>
  </g>
  <text x="400" y="300" text-anchor="middle" font-size="11" fill="#16a34a">W11&#8211;12: Path Planning</text>

  <!-- =================== ACT node (bottom-left) =================== -->
  <g>
    <rect x="35" y="220" width="170" height="60" rx="8" fill="#fef3c7" stroke="#f39c12" stroke-width="2"/>
    <!-- Wheeled robot icon -->
    <g transform="translate(65, 250)">
      <!-- chassis -->
      <rect x="-18" y="-7" width="36" height="12" rx="2" fill="#f59e0b" stroke="#92400e" stroke-width="0.8"/>
      <!-- sensor on front -->
      <circle cx="14" cy="-1" r="2" fill="#0f172a"/>
      <!-- wheels -->
      <circle cx="-11" cy="7" r="4" fill="#1f2937" stroke="#0f172a" stroke-width="0.8"/>
      <circle cx="11" cy="7" r="4" fill="#1f2937" stroke="#0f172a" stroke-width="0.8"/>
      <circle cx="-11" cy="7" r="1.3" fill="#f3f4f6"/>
      <circle cx="11" cy="7" r="1.3" fill="#f3f4f6"/>
      <!-- motion arc (radial) showing action -->
      <path d="M -24,-6 A 10 10 0 0 1 -24,6" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="1.5,1.5"/>
      <path d="M 24,-6 A 10 10 0 0 0 24,6" fill="none" stroke="#b45309" stroke-width="1" stroke-dasharray="1.5,1.5"/>
    </g>
    <text x="140" y="258" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45309">ACT</text>
  </g>
  <text x="120" y="300" text-anchor="middle" font-size="11" fill="#f39c12">W09: Kinematics</text>

  <!-- =================== Arrow labels =================== -->
  <text x="395" y="170" text-anchor="middle" transform="rotate(30, 395, 170)"
        font-size="11" fill="#64748b" font-style="italic">perceive &#8594; model</text>
  <text x="245" y="323" text-anchor="middle"
        font-size="11" fill="#64748b" font-style="italic">decide &#8594; command</text>
  <text x="95" y="170" text-anchor="middle" transform="rotate(-30, 95, 170)"
        font-size="11" fill="#64748b" font-style="italic">execute &#8594; observe</text>

  <!-- Footer caption -->
  <text x="260" y="345" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">
    Each loop iteration closes the gap between belief and reality.
  </text>
</svg>
