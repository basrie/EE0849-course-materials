<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" font-family="Arial, sans-serif">
  <defs>
    <!-- Radial gradient for fog: clear around robot, opaque farther away -->
    <radialGradient id="fog" cx="20%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0"/>
      <stop offset="35%" stop-color="#cbd5e1" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#94a3b8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Blur filter for ghost obstacles -->
    <filter id="blurHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Scene background -->
  <rect x="0" y="0" width="420" height="280" fill="#f8fafc"/>

  <!-- ================ HIDDEN ENVIRONMENT (ghosted) ================ -->
  <g filter="url(#blurHeavy)" opacity="0.35">
    <!-- Ghost wall on far right -->
    <rect x="370" y="30" width="10" height="220" fill="#475569"/>
    <!-- Ghost obstacle box -->
    <rect x="250" y="70" width="55" height="45" fill="#475569"/>
    <!-- Ghost chair/obstacle -->
    <circle cx="310" cy="200" r="22" fill="#475569"/>
    <!-- Ghost bottom wall -->
    <rect x="200" y="240" width="180" height="8" fill="#475569"/>
  </g>

  <!-- Fog overlay (hides everything beyond ~120 px from robot) -->
  <rect x="0" y="0" width="420" height="280" fill="url(#fog)"/>

  <!-- ================ ROBOT ================ -->
  <!-- Robot body (circle) -->
  <circle cx="80" cy="140" r="28" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>

  <!-- Left wheel (top) -->
  <rect x="62" y="100" width="12" height="16" rx="2" fill="#1e3a5f"/>
  <!-- Right wheel (bottom) -->
  <rect x="62" y="164" width="12" height="16" rx="2" fill="#1e3a5f"/>

  <!-- Forward direction indicator (eye / lens) -->
  <circle cx="100" cy="140" r="5" fill="#dbeafe"/>
  <circle cx="102" cy="140" r="2" fill="#1e40af"/>

  <!-- Robot label -->
  <text x="80" y="190" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="bold">robot</text>

  <!-- Direction / motion hint -->
  <line x1="115" y1="140" x2="140" y2="140" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- ================ QUESTION MARKS ================ -->
  <!-- Cluster of "?" radiating outward, at different distances/angles -->
  <g font-size="24" font-weight="bold" font-style="italic" fill="#f39c12">
    <text x="175" y="80" opacity="0.95">?</text>
    <text x="220" y="130" opacity="0.95">?</text>
    <text x="160" y="210" opacity="0.90">?</text>
    <text x="240" y="180" opacity="0.80">?</text>
  </g>
  <g font-size="18" font-weight="bold" font-style="italic" fill="#f39c12">
    <text x="285" y="95"  opacity="0.65">?</text>
    <text x="270" y="230" opacity="0.60">?</text>
    <text x="320" y="155" opacity="0.55">?</text>
  </g>
  <g font-size="14" font-weight="bold" font-style="italic" fill="#f39c12">
    <text x="350" y="120" opacity="0.40">?</text>
    <text x="340" y="200" opacity="0.40">?</text>
  </g>

  <!-- ================ ANNOTATION ================ -->
  <text x="260" y="35" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">what's out there?</text>

  <!-- Faint probe arrows from robot fading into fog -->
  <g stroke="#3b82f6" stroke-width="1.2" fill="none" opacity="0.25">
    <line x1="110" y1="125" x2="155" y2="100" stroke-dasharray="3,4"/>
    <line x1="112" y1="140" x2="165" y2="140" stroke-dasharray="3,4"/>
    <line x1="110" y1="158" x2="160" y2="185" stroke-dasharray="3,4"/>
  </g>
</svg>
