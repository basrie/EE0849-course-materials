<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="Arial, sans-serif">
  <defs>
    <marker id="rayEnd" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
    <marker id="rayFaint" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#fca5a5"/>
    </marker>
    <!-- Glass hatch: diagonal shine -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#eff6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Mirror polished gradient -->
    <linearGradient id="mirrorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <!-- Fog radial -->
    <radialGradient id="fogGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e5e7eb" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#d1d5db" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d1d5db" stop-opacity="0"/>
    </radialGradient>
    <!-- Blur for fog -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="560" height="340" fill="#fafbfc"/>

  <!-- Title -->
  <text x="280" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">When LiDAR Lies: Four Failure Modes</text>

  <!-- =================== LiDAR unit (shared source) =================== -->
  <g>
    <rect x="35" y="155" width="40" height="40" rx="4" fill="#dbeafe" stroke="#2f6ed3" stroke-width="1.8"/>
    <circle cx="55" cy="175" r="4" fill="#ef4444"/>
    <circle cx="55" cy="175" r="8" fill="none" stroke="#ef4444" stroke-width="0.6" stroke-dasharray="1,1" opacity="0.6"/>
    <text x="55" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a5f">LiDAR</text>
  </g>

  <!-- =================== RAY 1: Glass (transparent, passes through) =================== -->
  <!-- Outgoing ray from LiDAR to glass -->
  <line x1="75" y1="60" x2="255" y2="60" stroke="#ef4444" stroke-width="1.8"/>
  <!-- Glass panel (thin vertical with diagonal shine) -->
  <rect x="255" y="35" width="10" height="50" fill="url(#glassGrad)" stroke="#60a5fa" stroke-width="1.2"/>
  <line x1="256" y1="80" x2="264" y2="40" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  <line x1="258" y1="82" x2="262" y2="66" stroke="#ffffff" stroke-width="0.6" opacity="0.7"/>
  <!-- Ray continues (mostly) through -->
  <line x1="265" y1="60" x2="460" y2="60" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#rayEnd)"/>
  <!-- Tiny reflected sliver -->
  <line x1="255" y1="60" x2="220" y2="52" stroke="#fca5a5" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.5"/>
  <!-- Labels -->
  <text x="260" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Glass / Clear plastic</text>
  <text x="460" y="52" text-anchor="end" font-size="9" fill="#dc2626" font-style="italic">no return &#8594; reads as "infinite"</text>

  <!-- =================== RAY 2: Dark / absorbing surface =================== -->
  <line x1="75" y1="125" x2="280" y2="125" stroke="#ef4444" stroke-width="1.8"/>
  <!-- Dark matte surface: black with grainy texture hint -->
  <rect x="280" y="100" width="26" height="50" fill="#0f172a" stroke="#374151" stroke-width="1"/>
  <!-- Speckle (matte suggestion) -->
  <g fill="#374151" opacity="0.6">
    <rect x="283" y="105" width="1.5" height="1.5"/>
    <rect x="289" y="112" width="1.5" height="1.5"/>
    <rect x="296" y="108" width="1.5" height="1.5"/>
    <rect x="301" y="119" width="1.5" height="1.5"/>
    <rect x="286" y="125" width="1.5" height="1.5"/>
    <rect x="298" y="132" width="1.5" height="1.5"/>
    <rect x="290" y="140" width="1.5" height="1.5"/>
    <rect x="302" y="143" width="1.5" height="1.5"/>
  </g>
  <!-- Only very weak return arrow heading back -->
  <line x1="280" y1="125" x2="90" y2="125" stroke="#fca5a5" stroke-width="0.7" stroke-dasharray="2,5" opacity="0.45" marker-end="url(#rayFaint)"/>
  <text x="293" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">Dark / matte surface</text>
  <text x="460" y="118" text-anchor="end" font-size="9" fill="#dc2626" font-style="italic">absorbs light &#8594; weak / noisy return</text>

  <!-- =================== RAY 3: Mirror (specular deflection) =================== -->
  <line x1="75" y1="200" x2="290" y2="200" stroke="#ef4444" stroke-width="1.8"/>
  <!-- Mirror: angled at 30 deg, so incidence = 30 from normal, reflection = 30 -->
  <!-- Place mirror at (290,200), rotated -35 deg. Outgoing ray comes horizontal from left. -->
  <g transform="translate(295, 200) rotate(-35)">
    <rect x="-3" y="-25" width="6" height="50" fill="url(#mirrorGrad)" stroke="#475569" stroke-width="1"/>
    <!-- Shine streaks -->
    <line x1="-1" y1="-20" x2="-1" y2="-4" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
    <line x1="1" y1="-16" x2="1" y2="-10" stroke="#ffffff" stroke-width="0.5" opacity="0.8"/>
  </g>
  <!-- Normal (perpendicular to mirror, for clarity) -->
  <line x1="295" y1="200" x2="352" y2="160" stroke="#64748b" stroke-width="0.6" stroke-dasharray="2,2" opacity="0.7"/>
  <text x="348" y="158" font-size="7" fill="#64748b" font-style="italic">normal</text>
  <!-- Reflected ray bouncing away at angle (not back to LiDAR) -->
  <!-- Incident: horizontal (0°) hits mirror rotated -35° from vertical; reflected ray angle ~ 2*35 = 70° below incident => downward -->
  <line x1="295" y1="200" x2="430" y2="290" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#rayEnd)"/>
  <!-- Incidence/reflection arc hint -->
  <path d="M 280 200 A 15 15 0 0 1 305 210" fill="none" stroke="#f39c12" stroke-width="0.8" opacity="0.7"/>
  <path d="M 310 212 A 18 18 0 0 1 320 225" fill="none" stroke="#f39c12" stroke-width="0.8" opacity="0.7"/>
  <text x="310" y="167" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">Mirror / Polished metal</text>
  <text x="460" y="290" text-anchor="end" font-size="9" fill="#dc2626" font-style="italic">specular bounce &#8594; phantom distance</text>

  <!-- =================== RAY 4: Fog / rain (scattering) =================== -->
  <line x1="75" y1="275" x2="200" y2="275" stroke="#ef4444" stroke-width="1.8"/>
  <!-- Fog cloud (layered blurred ellipses) -->
  <g filter="url(#softBlur)">
    <ellipse cx="250" cy="270" rx="55" ry="28" fill="url(#fogGrad)"/>
    <ellipse cx="270" cy="280" rx="45" ry="22" fill="url(#fogGrad)"/>
    <ellipse cx="230" cy="282" rx="35" ry="16" fill="url(#fogGrad)"/>
  </g>
  <!-- Rain droplets (tiny vertical streaks) -->
  <g stroke="#60a5fa" stroke-width="1" opacity="0.8">
    <line x1="220" y1="245" x2="218" y2="253"/>
    <line x1="235" y1="240" x2="233" y2="250"/>
    <line x1="250" y1="247" x2="248" y2="256"/>
    <line x1="262" y1="241" x2="260" y2="251"/>
    <line x1="275" y1="248" x2="273" y2="257"/>
    <line x1="290" y1="244" x2="288" y2="253"/>
    <line x1="245" y1="302" x2="243" y2="311"/>
    <line x1="268" y1="304" x2="266" y2="313"/>
  </g>
  <!-- Scattered rays inside fog, going every which way -->
  <g stroke="#fca5a5" stroke-width="1" stroke-dasharray="2,2" opacity="0.85">
    <line x1="210" y1="275" x2="235" y2="258" marker-end="url(#rayFaint)"/>
    <line x1="215" y1="275" x2="245" y2="290" marker-end="url(#rayFaint)"/>
    <line x1="220" y1="275" x2="250" y2="262" marker-end="url(#rayFaint)"/>
    <line x1="222" y1="275" x2="250" y2="285" marker-end="url(#rayFaint)"/>
    <line x1="205" y1="275" x2="180" y2="268" marker-end="url(#rayFaint)"/>
  </g>
  <text x="250" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">Fog / Rain / Smoke</text>
  <text x="460" y="282" text-anchor="end" font-size="9" fill="#dc2626" font-style="italic">scattering &#8594; false-short return</text>

  <!-- =================== Legend banner at bottom =================== -->
  <rect x="35" y="315" width="500" height="20" rx="4" fill="#fef3c7" stroke="#f39c12" stroke-width="1"/>
  <text x="285" y="329" text-anchor="middle" font-size="10" fill="#78350f">
    <tspan font-weight="bold">Takeaway:</tspan> LiDAR fails when light doesn&#8217;t bounce back predictably &#8212; fuse with camera / sonar when possible.
  </text>
</svg>
