<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440" font-family="Arial, sans-serif">
  <defs>
    <!-- Hatch for occupied (wall) cells -->
    <pattern id="wallHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#1e293b"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#334155" stroke-width="1.2"/>
    </pattern>
    <!-- Radial for unknown: fog-like -->
    <radialGradient id="unknownGrad" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <!-- Ray arrowhead -->
    <marker id="rayEnd" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#ef4444"/>
    </marker>
    <!-- Soft blur for shadow fog -->
    <filter id="fogBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Occupancy grid from one scan pose</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">beams reveal free cells, endpoints mark walls, the shadow stays unknown</text>

  <!-- Grid origin: (70, 55), cell=30, 12 cols x 10 rows -->

  <!-- ======================== FREE cells (white base) ======================== -->
  <g fill="#ffffff">
    <!-- All interior cells first (rows 1..8, cols 1..10), we'll overlay walls + unknown after -->
    <rect x="100" y="85"  width="300" height="30"/>
    <rect x="100" y="115" width="300" height="30"/>
    <rect x="100" y="145" width="300" height="30"/>
    <rect x="100" y="175" width="300" height="30"/>
    <rect x="100" y="205" width="300" height="30"/>
    <rect x="100" y="235" width="300" height="30"/>
    <rect x="100" y="265" width="300" height="30"/>
    <rect x="100" y="295" width="300" height="30"/>
  </g>

  <!-- ======================== Unknown (occlusion shadow behind obstacle) ======================== -->
  <!-- Only cells ENTIRELY inside the shadow wedge are unknown.
       Cells straddled by the silhouette are reached by a grazing beam and remain free.
       With robot (175,220): upper silhouette angle = 23.20 deg, lower = -8.13 deg.
       A cell is entirely in shadow iff all 4 corner angles fall within (-8.13, 23.20). -->
  <g fill="url(#unknownGrad)">
    <rect x="340" y="175" width="30" height="30"/>  <!-- (9,4)  directly behind obstacle -->
    <rect x="370" y="175" width="30" height="30"/>  <!-- (10,4) directly behind obstacle -->
    <rect x="340" y="205" width="30" height="30"/>  <!-- (9,5)  directly behind obstacle -->
    <rect x="370" y="205" width="30" height="30"/>  <!-- (10,5) directly behind obstacle -->
    <rect x="370" y="145" width="30" height="30"/>  <!-- (10,3) narrow upper strip on right wall -->
  </g>
  <!-- Fog veil over the shadow -->
  <g filter="url(#fogBlur)" opacity="0.4">
    <ellipse cx="375" cy="195" rx="32" ry="52" fill="#64748b"/>
  </g>
  <!-- "?" marks in unknown region at varied opacities -->
  <g font-size="14" font-weight="bold" fill="#475569" font-style="italic" text-anchor="middle">
    <text x="355" y="196" opacity="0.85">?</text>
    <text x="385" y="225" opacity="0.7">?</text>
    <text x="385" y="165" opacity="0.6">?</text>
  </g>

  <!-- ======================== OCCUPIED (walls + obstacle) ======================== -->
  <g fill="url(#wallHatch)" stroke="#0f172a" stroke-width="0.5">
    <!-- Top wall (row 0) -->
    <rect x="70"  y="55" width="360" height="30"/>
    <!-- Bottom wall (row 9) -->
    <rect x="70"  y="325" width="360" height="30"/>
    <!-- Left wall (col 0, rows 1..8) -->
    <rect x="70"  y="85" width="30" height="240"/>
    <!-- Right wall (col 11, rows 1..8) -->
    <rect x="400" y="85" width="30" height="240"/>
    <!-- Interior obstacle (cols 7-8, rows 4-5) -->
    <rect x="280" y="175" width="60" height="60"/>
  </g>

  <!-- ======================== Grid lines on top ======================== -->
  <g stroke="#cbd5e1" stroke-width="0.4" opacity="0.8">
    <line x1="100" y1="85" x2="100" y2="325"/>
    <line x1="130" y1="85" x2="130" y2="325"/>
    <line x1="160" y1="85" x2="160" y2="325"/>
    <line x1="190" y1="85" x2="190" y2="325"/>
    <line x1="220" y1="85" x2="220" y2="325"/>
    <line x1="250" y1="85" x2="250" y2="325"/>
    <line x1="280" y1="85" x2="280" y2="325"/>
    <line x1="310" y1="85" x2="310" y2="325"/>
    <line x1="340" y1="85" x2="340" y2="325"/>
    <line x1="370" y1="85" x2="370" y2="325"/>
    <line x1="400" y1="85" x2="400" y2="325"/>
    <line x1="100" y1="115" x2="400" y2="115"/>
    <line x1="100" y1="145" x2="400" y2="145"/>
    <line x1="100" y1="175" x2="400" y2="175"/>
    <line x1="100" y1="205" x2="400" y2="205"/>
    <line x1="100" y1="235" x2="400" y2="235"/>
    <line x1="100" y1="265" x2="400" y2="265"/>
    <line x1="100" y1="295" x2="400" y2="295"/>
  </g>

  <!-- ======================== LiDAR beams from robot ======================== -->
  <!-- Robot at cell (3, 5) -> center (70+3*30+15, 55+5*30+15) actually rows flip: row 5 center = (175, 220) from top=15. With origin 55: top-based row 5 center = (55 + 5*30 + 15) = 220 (yes). col 3 center = (70+3*30+15) = 175. Let's use (175, 220). -->
  <!-- Draw several rays:
       Ray 1: upward to top wall  -> (175, 85)
       Ray 2: upper-left to left wall  -> (100, 145)
       Ray 3: left to left wall -> (100, 220)
       Ray 4: lower-left to left wall -> (100, 290)
       Ray 5: down to bottom wall -> (175, 325)
       Ray 6: right blocked by obstacle (stops at (280, 190)) -> creates occlusion shadow
       Ray 7: upper-right around obstacle -> (400, 120)
       Ray 8: lower-right around obstacle -> (400, 290)
  -->
  <g stroke="#ef4444" stroke-width="1" stroke-dasharray="2,1.5" opacity="0.7">
    <line x1="175" y1="220" x2="175" y2="85"   marker-end="url(#rayEnd)"/>
    <line x1="175" y1="220" x2="100" y2="145"  marker-end="url(#rayEnd)"/>
    <line x1="175" y1="220" x2="100" y2="220"  marker-end="url(#rayEnd)"/>
    <line x1="175" y1="220" x2="100" y2="290"  marker-end="url(#rayEnd)"/>
    <line x1="175" y1="220" x2="175" y2="325"  marker-end="url(#rayEnd)"/>
    <line x1="175" y1="220" x2="250" y2="325"  marker-end="url(#rayEnd)"/>
    <!-- Upper-right ray clears the top of the obstacle by a full cell -->
    <line x1="175" y1="220" x2="400" y2="95"   marker-end="url(#rayEnd)"/>
    <line x1="175" y1="220" x2="400" y2="295"  marker-end="url(#rayEnd)"/>
    <!-- Ray that hits the obstacle: endpoint moved off the (6,5)/(7,4)/(6,4)/(7,5) 4-corner to the middle of (7,4)'s left face -->
    <line x1="175" y1="220" x2="280" y2="190"  marker-end="url(#rayEnd)"/>
  </g>

  <!-- Intermediate "filler" beams: represent the dense angular sampling of a real LiDAR (stroke thinner, lower opacity so they read as extra samples, not new concepts). -->
  <g stroke="#ef4444" stroke-width="0.7" stroke-dasharray="2,1.5" opacity="0.45">
    <!-- Grazing beam just above upper silhouette (24 deg) - clears obstacle TL corner
         by 1.7 px, traverses (8,3) and grazes (9,3) so they remain free. -->
    <line x1="175" y1="220" x2="400" y2="120" marker-end="url(#rayEnd)"/>
    <!-- Just above upper silhouette (26 deg) - covers (9,2), (10,2), (10,1) -->
    <line x1="175" y1="220" x2="400" y2="110" marker-end="url(#rayEnd)"/>
    <!-- Just below lower silhouette (-12 deg) - covers (8,6), (9,6), (10,6) -->
    <line x1="175" y1="220" x2="400" y2="268" marker-end="url(#rayEnd)"/>
    <!-- Upper-right fan (50 deg) -->
    <line x1="175" y1="220" x2="288" y2="85"  marker-end="url(#rayEnd)"/>
    <!-- Upper fan, slight left of vertical (112 deg) -->
    <line x1="175" y1="220" x2="121" y2="85"  marker-end="url(#rayEnd)"/>
    <!-- Left fan, above horizontal (157 deg) -->
    <line x1="175" y1="220" x2="100" y2="188" marker-end="url(#rayEnd)"/>
    <!-- Left fan, below horizontal (200 deg) -->
    <line x1="175" y1="220" x2="100" y2="247" marker-end="url(#rayEnd)"/>
    <!-- Lower-left fan (248 deg) -->
    <line x1="175" y1="220" x2="133" y2="325" marker-end="url(#rayEnd)"/>
    <!-- Lower fan, right of vertical (288 deg) -->
    <line x1="175" y1="220" x2="209" y2="325" marker-end="url(#rayEnd)"/>
    <!-- Lower-right fan (323 deg) -->
    <line x1="175" y1="220" x2="314" y2="325" marker-end="url(#rayEnd)"/>
  </g>

  <!-- Shadow cone outline (silhouette rays from robot through obstacle TL and BL corners, extended to right wall) -->
  <path d="M 280 175 L 400 124 L 400 252 L 280 235 L 340 235 L 340 175 Z"
        fill="none" stroke="#f39c12" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- ======================== Robot icon ======================== -->
  <g>
    <circle cx="175" cy="220" r="11" fill="#2f6ed3" stroke="#1e40af" stroke-width="1.5"/>
    <!-- heading triangle pointing right-ish -->
    <polygon points="188,220 181,215 181,225" fill="#ffffff"/>
  </g>
  <text x="175" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f6ed3">robot</text>

  <!-- ======================== Callout labels ======================== -->
  <!-- Free label pointing to a free cell -->
  <g>
    <rect x="25" y="110" width="52" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="51" y="123" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">FREE</text>
    <line x1="77" y1="119" x2="130" y2="140" stroke="#16a34a" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>
  <!-- Occupied label pointing to obstacle -->
  <g>
    <rect x="440" y="90" width="72" height="18" rx="3" fill="#1e293b"/>
    <text x="476" y="103" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">OCCUPIED</text>
    <line x1="440" y1="102" x2="315" y2="185" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>
  <!-- Unknown label pointing to shadow -->
  <g>
    <rect x="440" y="195" width="72" height="18" rx="3" fill="#94a3b8"/>
    <text x="476" y="208" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">UNKNOWN</text>
    <line x1="440" y1="205" x2="400" y2="205" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>

  <!-- ======================== LEGEND ======================== -->
  <g transform="translate(70, 375)">
    <rect x="0" y="0" width="380" height="40" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Free -->
    <rect x="12" y="12" width="16" height="16" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="35" y="25" font-size="10" fill="#334155">Free (beam passed through)</text>

    <!-- Occupied -->
    <rect x="162" y="12" width="16" height="16" fill="url(#wallHatch)" stroke="#0f172a" stroke-width="0.5"/>
    <text x="185" y="25" font-size="10" fill="#334155">Occupied (beam endpoint)</text>

    <!-- Unknown -->
    <rect x="312" y="12" width="16" height="16" fill="url(#unknownGrad)"/>
    <text x="335" y="25" font-size="10" fill="#334155">Unknown</text>
  </g>

  <!-- Footer -->
  <text x="260" y="432" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">
    A second pose from a different angle fills in the shadow.
  </text>
</svg>
