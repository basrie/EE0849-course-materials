<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="-apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrFree" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2a9d3f"/>
    </marker>
    <marker id="arrHit" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#d62828"/>
    </marker>
    <linearGradient id="rayFree" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a9d3f" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#2a9d3f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2a9d3f" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rayHit" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#d62828" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#d62828" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#d62828" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="cellGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Two scans of cell (5, 2) — one says <tspan fill="#15803d">free</tspan>, the other says <tspan fill="#b91c1c">occupied</tspan></text>

  <!-- Soft glow behind contested cell (drawn before grid for layering) -->
  <ellipse cx="402" cy="180" rx="80" ry="70" fill="url(#cellGlow)"/>

  <!-- ========== GRID 8x5, cells 44px, origin (160, 70) ========== -->
  <g transform="translate(160, 70)">
    <!-- Cell backgrounds -->
    <g fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8">
      <rect x="0"   y="0"   width="44" height="44"/><rect x="44"  y="0"   width="44" height="44"/><rect x="88"  y="0"   width="44" height="44"/><rect x="132" y="0"   width="44" height="44"/><rect x="176" y="0"   width="44" height="44"/><rect x="220" y="0"   width="44" height="44"/><rect x="264" y="0"   width="44" height="44"/><rect x="308" y="0"   width="44" height="44"/>
      <rect x="0"   y="44"  width="44" height="44"/><rect x="44"  y="44"  width="44" height="44"/><rect x="88"  y="44"  width="44" height="44"/><rect x="132" y="44"  width="44" height="44"/><rect x="176" y="44"  width="44" height="44"/><rect x="220" y="44"  width="44" height="44"/><rect x="264" y="44"  width="44" height="44"/><rect x="308" y="44"  width="44" height="44"/>
      <rect x="0"   y="88"  width="44" height="44"/><rect x="44"  y="88"  width="44" height="44"/><rect x="88"  y="88"  width="44" height="44"/><rect x="132" y="88"  width="44" height="44"/><rect x="176" y="88"  width="44" height="44"/><rect x="220" y="88"  width="44" height="44"/><rect x="264" y="88"  width="44" height="44"/><rect x="308" y="88"  width="44" height="44"/>
      <rect x="0"   y="132" width="44" height="44"/><rect x="44"  y="132" width="44" height="44"/><rect x="88"  y="132" width="44" height="44"/><rect x="132" y="132" width="44" height="44"/><rect x="176" y="132" width="44" height="44"/><rect x="220" y="132" width="44" height="44"/><rect x="264" y="132" width="44" height="44"/><rect x="308" y="132" width="44" height="44"/>
      <rect x="0"   y="176" width="44" height="44"/><rect x="44"  y="176" width="44" height="44"/><rect x="88"  y="176" width="44" height="44"/><rect x="132" y="176" width="44" height="44"/><rect x="176" y="176" width="44" height="44"/><rect x="220" y="176" width="44" height="44"/><rect x="264" y="176" width="44" height="44"/><rect x="308" y="176" width="44" height="44"/>
    </g>

    <!-- Faint green tint along Scan A's path (row 2, cols 0..4) -->
    <rect x="0" y="88" width="220" height="44" fill="#2a9d3f" fill-opacity="0.08"/>
    <!-- Faint red tint along Scan B's path (col 5, rows 3..4) -->
    <rect x="220" y="132" width="44" height="88" fill="#d62828" fill-opacity="0.10"/>

    <!-- Contested cell at (5,2): split diagonally to show two views -->
    <!-- Upper-right triangle = green (Scan A: free) -->
    <polygon points="220,88 264,88 264,132" fill="#bbf7d0"/>
    <!-- Lower-left triangle = red (Scan B: occupied) -->
    <polygon points="220,88 220,132 264,132" fill="#fecaca"/>
    <!-- Diagonal divider -->
    <line x1="220" y1="88" x2="264" y2="132" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cell border (highlighted) -->
    <rect x="220" y="88" width="44" height="44" fill="none" stroke="#f39c12" stroke-width="2.5"/>

    <!-- Question mark inside cell -->
    <text x="242" y="118" text-anchor="middle" font-size="24" font-weight="700" font-style="italic" fill="#b45309">?</text>

    <!-- Cell coordinate label above -->
    <text x="242" y="78" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">cell (5, 2)</text>
  </g>

  <!-- ========== Scan A: robot left, ray going right ========== -->
  <g>
    <!-- Ray crosses through contested cell and exits -->
    <line x1="106" y1="180" x2="446" y2="180" stroke="url(#rayFree)" stroke-width="3" marker-end="url(#arrFree)"/>
    <!-- Robot A -->
    <circle cx="90" cy="180" r="15" fill="#2f6ed3" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="90" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="white">A</text>
    <!-- Inline scan-A label, sits under robot, no box -->
    <g transform="translate(20, 220)">
      <circle cx="6" cy="6" r="6" fill="#2a9d3f"/>
      <text x="20" y="11" font-size="13" font-weight="600" fill="#15803d">Scan A — ray passes through</text>
      <text x="20" y="29" font-size="13" fill="#15803d">cell looks <tspan font-weight="700">free</tspan></text>
    </g>
  </g>

  <!-- ========== Scan B: robot below, ray going up ========== -->
  <g>
    <!-- Ray terminates at bottom of contested cell -->
    <line x1="402" y1="350" x2="402" y2="207" stroke="url(#rayHit)" stroke-width="3" marker-end="url(#arrHit)"/>
    <!-- Robot B -->
    <circle cx="402" cy="365" r="15" fill="#2f6ed3" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="402" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="white">B</text>
    <!-- Inline scan-B label, sits to right of robot, no box -->
    <g transform="translate(450, 358)">
      <circle cx="6" cy="6" r="6" fill="#d62828"/>
      <text x="20" y="11" font-size="13" font-weight="600" fill="#b91c1c">Scan B — ray terminates here</text>
      <text x="20" y="29" font-size="13" fill="#b91c1c">cell looks <tspan font-weight="700">occupied</tspan></text>
    </g>
  </g>

  <!-- ========== Bottom takeaway ========== -->
  <text x="360" y="418" text-anchor="middle" font-size="13" font-style="italic" fill="#64748b">A binary grid stores one value per cell — it cannot record the disagreement.</text>
</svg>
