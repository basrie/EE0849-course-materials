<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="axArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="520" height="300" fill="#fafbfc"/>

  <!-- ================ OPTICAL AXIS (principal ray) ================ -->
  <line x1="35" y1="150" x2="500" y2="150" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="500" y="142" text-anchor="end" font-size="9" fill="#64748b" font-style="italic">optical axis</text>

  <!-- ================ IMAGE PLANE (left) ================ -->
  <rect x="50" y="80" width="75" height="140" rx="3" fill="#dbeafe" fill-opacity="0.5" stroke="#2f6ed3" stroke-width="1.5"/>
  <text x="87" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">image plane</text>
  <text x="87" y="235" text-anchor="middle" font-size="10" fill="#64748b">H &#215; W pixels</text>

  <!-- Inverted (upside-down) projected triangle on image plane -->
  <polygon points="76,175 100,175 88,150" fill="#f39c12" fill-opacity="0.85" stroke="#b45309" stroke-width="1.2"/>
  <text x="88" y="190" text-anchor="middle" font-size="9" fill="#b45309" font-style="italic">pixel (u, v)</text>

  <!-- ================ PINHOLE ================ -->
  <circle cx="195" cy="150" r="5" fill="#1e293b"/>
  <circle cx="195" cy="150" r="2" fill="#f8fafc"/>
  <text x="195" y="130" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="bold">pinhole</text>

  <!-- Focal length dimension (f between image plane and pinhole) -->
  <line x1="125" y1="260" x2="195" y2="260" stroke="#475569" stroke-width="1"/>
  <line x1="125" y1="257" x2="125" y2="263" stroke="#475569" stroke-width="1"/>
  <line x1="195" y1="257" x2="195" y2="263" stroke="#475569" stroke-width="1"/>
  <text x="160" y="275" text-anchor="middle" font-size="11" font-style="italic" fill="#475569"><tspan font-weight="bold">f</tspan> (focal length)</text>

  <!-- ================ 3D WORLD: TWO OBJECTS AT DIFFERENT DEPTHS (depth ambiguity) ================ -->
  <!-- Near small object -->
  <g>
    <polygon points="285,135 310,135 297.5,150" fill="#f39c12" fill-opacity="0.55" stroke="#b45309" stroke-width="1.2"/>
    <text x="297.5" y="127" text-anchor="middle" font-size="10" fill="#b45309" font-weight="bold">near, small</text>
  </g>

  <!-- Far large object (same angular size!) -->
  <g>
    <polygon points="430,115 490,115 460,150" fill="#f39c12" fill-opacity="0.55" stroke="#b45309" stroke-width="1.2"/>
    <text x="460" y="108" text-anchor="middle" font-size="10" fill="#b45309" font-weight="bold">far, large</text>
  </g>

  <!-- Rays from top-of-objects through pinhole to image plane (same outgoing angle) -->
  <!-- Near top at (297.5, 135) -> pinhole (195, 150) -> (76, 175) -->
  <line x1="297.5" y1="135" x2="195" y2="150" stroke="#475569" stroke-width="0.9" stroke-dasharray="3,2"/>
  <line x1="195" y1="150" x2="76" y2="175" stroke="#475569" stroke-width="0.9" stroke-dasharray="3,2"/>

  <!-- Far top at (460, 115) -> pinhole (195, 150) — this actually maps to same pixel if angle matches -->
  <!-- For depth ambiguity visual: both rays converge at the pinhole from different depths. -->
  <!-- Slope check: near: (135-150)/(297.5-195) = -15/102.5 = -0.1463 -->
  <!-- Far:  we need slope (-0.1463) => dy = -0.1463 * (460-195) = -38.77 => y = 150-38.77 = 111.23 -->
  <!-- Adjust far-top y to ~111 so rays align exactly -->
  <line x1="460" y1="111" x2="195" y2="150" stroke="#475569" stroke-width="0.9" stroke-dasharray="3,2"/>
  <!-- (the segment 195->76 is already drawn above and shared) -->

  <!-- Update far-top polygon to (111 top) for consistency. We drew at y=115; let's redraw -->
  <rect x="429" y="110" width="62" height="6" fill="#fafbfc"/>  <!-- cover the old top -->
  <polygon points="430,111 490,111 460,150" fill="#f39c12" fill-opacity="0.55" stroke="#b45309" stroke-width="1.2"/>

  <!-- Bottom rays (from bottom of each object at y=150, on optical axis, project to image plane at y=150 on same axis) -->
  <line x1="297.5" y1="150" x2="195" y2="150" stroke="#475569" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.5"/>
  <line x1="195" y1="150" x2="100" y2="150" stroke="#475569" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.5"/>

  <!-- Depth labels z_near, z_far -->
  <line x1="195" y1="245" x2="297.5" y2="245" stroke="#2a9d3f" stroke-width="1"/>
  <line x1="195" y1="242" x2="195" y2="248" stroke="#2a9d3f" stroke-width="1"/>
  <line x1="297.5" y1="242" x2="297.5" y2="248" stroke="#2a9d3f" stroke-width="1"/>
  <text x="246" y="258" text-anchor="middle" font-size="10" fill="#2a9d3f" font-style="italic"><tspan font-weight="bold">z</tspan>&#8321;</text>

  <line x1="195" y1="275" x2="460" y2="275" stroke="#2a9d3f" stroke-width="1"/>
  <line x1="195" y1="272" x2="195" y2="278" stroke="#2a9d3f" stroke-width="1"/>
  <line x1="460" y1="272" x2="460" y2="278" stroke="#2a9d3f" stroke-width="1"/>
  <text x="328" y="288" text-anchor="middle" font-size="10" fill="#2a9d3f" font-style="italic"><tspan font-weight="bold">z</tspan>&#8322; (&gt; z&#8321;)</text>

  <!-- Arrow pointing at the image pixel with caption "depth is lost" -->
  <path d="M 160 50 Q 120 35 95 170" fill="none" stroke="#f39c12" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#axArrow)"/>
  <text x="170" y="45" text-anchor="start" font-size="11" fill="#b45309" font-weight="bold">Both objects</text>
  <text x="170" y="58" text-anchor="start" font-size="10" fill="#b45309">map to the same pixel</text>

  <!-- 3D world label -->
  <text x="430" y="210" text-anchor="end" font-size="11" font-weight="bold" fill="#b45309">3D world</text>
  <text x="430" y="224" text-anchor="end" font-size="9" fill="#64748b" font-style="italic">(x, y, z)</text>
</svg>
