<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
    </marker>
    <marker id="arrowX" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d62828"/>
    </marker>
    <marker id="arrowY" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2a9d3f"/>
    </marker>
  </defs>

  <!-- ==================== LEFT PANEL: Polar ==================== -->
  <rect x="10" y="10" width="230" height="260" rx="6" ry="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Panel title -->
  <text x="125" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Polar (r, &#x03B1;)</text>

  <!-- Sensor center -->
  <circle cx="125" cy="155" r="5" fill="#3b82f6"/>
  <text x="138" y="163" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">sensor</text>

  <!-- Room outline dots (polar positions, roughly rectangular room) -->
  <!-- Top wall -->
  <circle cx="80" cy="60" r="4" fill="#ef4444"/>
  <circle cx="125" cy="55" r="4" fill="#ef4444"/>
  <circle cx="170" cy="60" r="4" fill="#ef4444"/>
  <!-- Right wall -->
  <circle cx="205" cy="105" r="4" fill="#ef4444"/>
  <circle cx="210" cy="155" r="4" fill="#ef4444"/>
  <circle cx="205" cy="205" r="4" fill="#ef4444"/>
  <!-- Bottom wall -->
  <circle cx="170" cy="240" r="4" fill="#ef4444"/>
  <circle cx="80" cy="240" r="4" fill="#ef4444"/>
  <!-- Left wall -->
  <circle cx="40" cy="205" r="4" fill="#ef4444"/>
  <circle cx="35" cy="105" r="4" fill="#ef4444"/>

  <!-- Dashed range lines from sensor to a few dots -->
  <line x1="125" y1="155" x2="80" y2="60" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="125" y1="155" x2="205" y2="105" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="125" y1="155" x2="40" y2="205" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Representative range line (solid, labeled) to top-right dot -->
  <line x1="125" y1="155" x2="170" y2="60" stroke="#333333" stroke-width="1.2"/>

  <!-- r_i label along the representative line -->
  <text x="160" y="100" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#333333" transform="rotate(-64.5, 160, 100)">r<tspan font-size="8" dy="3">i</tspan></text>

  <!-- Angle arc for alpha_i -->
  <!-- Reference direction: horizontal right from sensor -->
  <line x1="125" y1="155" x2="165" y2="155" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="3,2"/>
  <!-- Arc from 0 deg to ~64.5 deg (angle to point 170,60 from center 125,155: atan2(155-60, 170-125) ~ 64.7 deg above horizontal) -->
  <!-- Arc radius 30, from (155,155) sweeping up -->
  <path d="M 155,155 A 30,30 0 0,0 137.8,127.2" fill="none" stroke="#f39c12" stroke-width="1.5"/>
  <!-- alpha_i label -->
  <text x="155" y="140" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#f39c12">&#x03B1;<tspan font-size="8" dy="3">i</tspan></text>


  <!-- ==================== CENTER ARROW + EQUATIONS ==================== -->
  <!-- Arrow -->
  <line x1="255" y1="140" x2="345" y2="140" stroke="#333333" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Equations -->
  <text x="300" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#1e293b">x = r cos &#x03B1;</text>
  <text x="300" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#1e293b">y = r sin &#x03B1;</text>


  <!-- ==================== RIGHT PANEL: Cartesian ==================== -->
  <rect x="360" y="10" width="230" height="260" rx="6" ry="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Panel title -->
  <text x="475" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Cartesian (x, y)</text>

  <!-- Axes origin at (475, 195) — centered in panel -->
  <!-- X axis (red per course palette) -->
  <line x1="375" y1="195" x2="572" y2="195" stroke="#d62828" stroke-width="1.8" marker-end="url(#arrowX)"/>
  <text x="570" y="210" font-family="Arial, sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#d62828">x</text>
  <!-- Y axis (green per course palette) -->
  <line x1="475" y1="258" x2="475" y2="48" stroke="#2a9d3f" stroke-width="1.8" marker-end="url(#arrowY)"/>
  <text x="463" y="55" font-family="Arial, sans-serif" font-size="12" font-style="italic" font-weight="bold" fill="#2a9d3f">y</text>

  <!-- Tick marks on X axis -->
  <line x1="515" y1="192" x2="515" y2="198" stroke="#333333" stroke-width="1"/>
  <line x1="555" y1="192" x2="555" y2="198" stroke="#333333" stroke-width="1"/>
  <line x1="435" y1="192" x2="435" y2="198" stroke="#333333" stroke-width="1"/>
  <line x1="395" y1="192" x2="395" y2="198" stroke="#333333" stroke-width="1"/>

  <!-- Tick marks on Y axis -->
  <line x1="472" y1="155" x2="478" y2="155" stroke="#333333" stroke-width="1"/>
  <line x1="472" y1="115" x2="478" y2="115" stroke="#333333" stroke-width="1"/>
  <line x1="472" y1="75" x2="478" y2="75" stroke="#333333" stroke-width="1"/>
  <line x1="472" y1="235" x2="478" y2="235" stroke="#333333" stroke-width="1"/>

  <!-- Origin dot (sensor position) -->
  <circle cx="475" cy="195" r="3" fill="#3b82f6"/>

  <!-- Room outline dots in Cartesian (same shape as polar, mapped to axes) -->
  <!-- Origin at (475,195). Room ~symmetric around sensor. -->
  <!-- Top wall (y positive = up in SVG means smaller y) -->
  <circle cx="435" cy="75" r="4" fill="#ef4444"/>
  <circle cx="475" cy="70" r="4" fill="#ef4444"/>
  <circle cx="515" cy="75" r="4" fill="#ef4444"/>
  <!-- Right wall -->
  <circle cx="547" cy="115" r="4" fill="#ef4444"/>
  <circle cx="550" cy="195" r="4" fill="#ef4444"/>
  <circle cx="547" cy="240" r="4" fill="#ef4444"/>
  <!-- Bottom wall -->
  <circle cx="515" cy="252" r="4" fill="#ef4444"/>
  <circle cx="435" cy="252" r="4" fill="#ef4444"/>
  <!-- Left wall -->
  <circle cx="400" cy="240" r="4" fill="#ef4444"/>
  <circle cx="397" cy="115" r="4" fill="#ef4444"/>

  <!-- Representative point label on top-right dot (515, 75) -->
  <!-- Dashed guide lines from point to axes -->
  <line x1="515" y1="75" x2="515" y2="195" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="3,2"/>
  <line x1="515" y1="75" x2="475" y2="75" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="3,2"/>
  <!-- Label -->
  <text x="521" y="68" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#333333">(x<tspan font-size="8" dy="3">i</tspan><tspan dy="-3">, y</tspan><tspan font-size="8" dy="3">i</tspan><tspan dy="-3">)</tspan></text>

</svg>