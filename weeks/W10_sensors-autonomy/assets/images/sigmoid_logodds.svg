<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" font-family="Arial, sans-serif">
  <defs>
    <marker id="axArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#333" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Plot area: l in [-5, 5] -> x in [60, 460]  (40 px per unit)
                  p in [0, 1]   -> y in [260, 40] (220 px per unit, flipped) -->

  <!-- Background -->
  <rect x="60" y="40" width="400" height="220" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Horizontal gridline at p = 0.5 -->
  <line x1="60" y1="150" x2="460" y2="150" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Vertical gridline at l = 0 -->
  <line x1="260" y1="40" x2="260" y2="260" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- X axis -->
  <line x1="50" y1="260" x2="470" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#axArrow)"/>
  <!-- X ticks and labels: -5, -2.2, 0, 2.2, 5 -->
  <!-- l = -5 -> x = 60 -->
  <line x1="60" y1="257" x2="60" y2="263" stroke="#333" stroke-width="1"/>
  <text x="60" y="278" text-anchor="middle" font-size="11" fill="#475569">-5</text>
  <!-- l = -2.2 -> x = 172 -->
  <line x1="172" y1="257" x2="172" y2="263" stroke="#333" stroke-width="1"/>
  <text x="172" y="278" text-anchor="middle" font-size="11" fill="#475569">-2.2</text>
  <!-- l = 0 -> x = 260 -->
  <line x1="260" y1="257" x2="260" y2="263" stroke="#333" stroke-width="1"/>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#475569">0</text>
  <!-- l = +2.2 -> x = 348 -->
  <line x1="348" y1="257" x2="348" y2="263" stroke="#333" stroke-width="1"/>
  <text x="348" y="278" text-anchor="middle" font-size="11" fill="#475569">+2.2</text>
  <!-- l = +5 -> x = 460 -->
  <line x1="460" y1="257" x2="460" y2="263" stroke="#333" stroke-width="1"/>
  <text x="460" y="278" text-anchor="middle" font-size="11" fill="#475569">+5</text>
  <!-- X axis label -->
  <text x="470" y="255" font-size="12" font-style="italic" fill="#333">l</text>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#475569">log-odds &#8467;</text>

  <!-- Y axis -->
  <line x1="60" y1="270" x2="60" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#axArrow)"/>
  <!-- Y ticks: 0, 0.1, 0.5, 0.9, 1 -->
  <!-- p = 0 -> y = 260 -->
  <line x1="57" y1="260" x2="63" y2="260" stroke="#333" stroke-width="1"/>
  <text x="52" y="264" text-anchor="end" font-size="11" fill="#475569">0</text>
  <!-- p = 0.1 -> y = 238 -->
  <line x1="57" y1="238" x2="63" y2="238" stroke="#333" stroke-width="1"/>
  <text x="52" y="242" text-anchor="end" font-size="11" fill="#475569">0.1</text>
  <!-- p = 0.5 -> y = 150 -->
  <line x1="57" y1="150" x2="63" y2="150" stroke="#333" stroke-width="1"/>
  <text x="52" y="154" text-anchor="end" font-size="11" fill="#475569">0.5</text>
  <!-- p = 0.9 -> y = 62 -->
  <line x1="57" y1="62" x2="63" y2="62" stroke="#333" stroke-width="1"/>
  <text x="52" y="66" text-anchor="end" font-size="11" fill="#475569">0.9</text>
  <!-- p = 1 -> y = 40 -->
  <line x1="57" y1="40" x2="63" y2="40" stroke="#333" stroke-width="1"/>
  <text x="52" y="44" text-anchor="end" font-size="11" fill="#475569">1</text>
  <!-- Y axis label -->
  <text x="28" y="150" text-anchor="middle" font-size="11" fill="#475569" transform="rotate(-90, 28, 150)">probability p</text>

  <!-- Sigmoid curve: p = 1/(1+e^-l) sampled every 0.25 from l=-5 to l=+5 -->
  <polyline fill="none" stroke="#7b2cbf" stroke-width="2.5"
    points="60,258.5 70,258.1 80,257.6 90,256.9 100,256.0 110,254.9 120,253.6 130,251.8
            140,249.6 150,246.8 160,243.3 170,239.0 180,233.8 190,227.4 200,219.9 210,211.0
            220,200.8 230,189.4 240,176.9 250,163.7 260,150.0 270,136.3 280,123.1 290,110.6
            300,99.2 310,89.0 320,80.1 330,72.6 340,66.2 350,61.0 360,56.7 370,53.2
            380,50.4 390,48.2 400,46.5 410,45.1 420,44.0 430,43.1 440,42.4 450,41.9 460,41.5"/>

  <!-- Key points from the table (highlighted in orange) -->
  <!-- (l=-2.2, p=0.1) -> (172, 238) -->
  <circle cx="172" cy="238" r="5" fill="#f39c12" stroke="#ffffff" stroke-width="1.5"/>
  <text x="172" y="226" text-anchor="middle" font-size="10" fill="#b45309" font-weight="bold">likely free</text>
  <text x="172" y="216" text-anchor="middle" font-size="9" fill="#b45309">(-2.2, 0.1)</text>

  <!-- (l=0, p=0.5) -> (260, 150) -->
  <circle cx="260" cy="150" r="5" fill="#f39c12" stroke="#ffffff" stroke-width="1.5"/>
  <text x="268" y="142" font-size="10" fill="#b45309" font-weight="bold">unknown</text>
  <text x="268" y="132" font-size="9" fill="#b45309">(0, 0.5)</text>

  <!-- (l=+2.2, p=0.9) -> (348, 62) -->
  <circle cx="348" cy="62" r="5" fill="#f39c12" stroke="#ffffff" stroke-width="1.5"/>
  <text x="348" y="80" text-anchor="middle" font-size="10" fill="#b45309" font-weight="bold">likely occupied</text>
  <text x="348" y="92" text-anchor="middle" font-size="9" fill="#b45309">(+2.2, 0.9)</text>

  <!-- Formula annotation -->
  <text x="410" y="110" text-anchor="middle" font-size="11" font-style="italic" fill="#7b2cbf" font-weight="bold">p = 1 / (1 + e^(-&#8467;))</text>

  <!-- Asymptote labels -->
  <text x="75" y="255" font-size="9" fill="#94a3b8" font-style="italic">certain free</text>
  <text x="445" y="48" text-anchor="end" font-size="9" fill="#94a3b8" font-style="italic">certain occupied</text>
</svg>
