<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" font-family="Arial, sans-serif">
  <defs>
    <style>
      text { fill: #64748b; }
    </style>
  </defs>

  <!-- Center at 160,160. Scale: 1m = 22px. Range rings: 2, 4, 6m => r=44, 88, 132 -->

  <!-- Angular gridlines 0/90/180/270 -->
  <line x1="160" y1="20" x2="160" y2="300" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,3"/>
  <line x1="20" y1="160" x2="300" y2="160" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4,3"/>

  <!-- Range rings -->
  <circle cx="160" cy="160" r="44"  fill="none" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <circle cx="160" cy="160" r="88"  fill="none" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>
  <circle cx="160" cy="160" r="132" fill="none" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Range labels (along 0 deg axis) -->
  <text x="206" y="156" font-size="10">2m</text>
  <text x="250" y="156" font-size="10">4m</text>
  <text x="294" y="156" font-size="10">6m</text>

  <!-- Angle labels -->
  <text x="306" y="163" font-size="11" font-weight="600">0&#176;</text>
  <text x="160" y="14"  text-anchor="middle" font-size="11" font-weight="600">90&#176;</text>
  <text x="2"   y="163" font-size="11" font-weight="600">180&#176;</text>
  <text x="160" y="315" text-anchor="middle" font-size="11" font-weight="600">270&#176;</text>

  <!-- LiDAR center -->
  <circle cx="160" cy="160" r="5" fill="#2f6ed3"/>
  <text x="168" y="175" fill="#2f6ed3" font-size="10" font-weight="bold">LiDAR</text>

  <!--
    Room: 8 x 10 m centered on LiDAR (half-widths 4 m, 5 m).
    Scale: 1 m = 22 px. Half-widths in px: 88, 110.
    Point at angle t has range = min(4/|cos t|, 5/|sin t|).
    Dot positions precomputed; 28 dots at ~12.9 deg spacing.
    Screen y up = negative SVG y.
  -->

  <!-- Right wall (0..~51 deg) -->
  <circle cx="248" cy="160" r="3" fill="#ef4444"/>                 <!-- 0 -->
  <circle cx="248" cy="140" r="3" fill="#ef4444"/>                 <!-- 13 -->
  <circle cx="248" cy="117" r="3" fill="#ef4444"/>                 <!-- 26 -->
  <circle cx="248" cy="89"  r="3" fill="#ef4444"/>                 <!-- 39 -->
  <circle cx="248" cy="51"  r="3" fill="#ef4444"/>                 <!-- 51 -->
  <!-- Top wall (58..122 deg) -->
  <circle cx="229" cy="50"  r="3" fill="#ef4444"/>                 <!-- 58 -->
  <circle cx="211" cy="50"  r="3" fill="#ef4444"/>                 <!-- 65 -->
  <circle cx="186" cy="50"  r="3" fill="#ef4444"/>                 <!-- 77 -->
  <circle cx="160" cy="50"  r="3" fill="#ef4444"/>                 <!-- 90 -->
  <circle cx="134" cy="50"  r="3" fill="#ef4444"/>                 <!-- 103 -->
  <circle cx="109" cy="50"  r="3" fill="#ef4444"/>                 <!-- 115 -->
  <circle cx="91"  cy="50"  r="3" fill="#ef4444"/>                 <!-- 122 -->
  <!-- Left wall (129..231 deg) -->
  <circle cx="72"  cy="51"  r="3" fill="#ef4444"/>                 <!-- 129 -->
  <circle cx="72"  cy="89"  r="3" fill="#ef4444"/>                 <!-- 141 -->
  <circle cx="72"  cy="117" r="3" fill="#ef4444"/>                 <!-- 154 -->
  <circle cx="72"  cy="140" r="3" fill="#ef4444"/>                 <!-- 167 -->
  <circle cx="72"  cy="160" r="3" fill="#ef4444"/>                 <!-- 180 -->
  <circle cx="72"  cy="180" r="3" fill="#ef4444"/>                 <!-- 193 -->
  <circle cx="72"  cy="203" r="3" fill="#ef4444"/>                 <!-- 206 -->
  <circle cx="72"  cy="231" r="3" fill="#ef4444"/>                 <!-- 219 -->
  <circle cx="72"  cy="269" r="3" fill="#ef4444"/>                 <!-- 231 -->
  <!-- Bottom wall (238..302 deg) -->
  <circle cx="91"  cy="270" r="3" fill="#ef4444"/>                 <!-- 238 -->
  <circle cx="109" cy="270" r="3" fill="#ef4444"/>                 <!-- 245 -->
  <circle cx="134" cy="270" r="3" fill="#ef4444"/>                 <!-- 257 -->
  <circle cx="160" cy="270" r="3" fill="#ef4444"/>                 <!-- 270 -->
  <circle cx="186" cy="270" r="3" fill="#ef4444"/>                 <!-- 283 -->
  <circle cx="211" cy="270" r="3" fill="#ef4444"/>                 <!-- 295 -->
  <circle cx="229" cy="270" r="3" fill="#ef4444"/>                 <!-- 302 -->
  <!-- Right wall (309..347 deg) -->
  <circle cx="248" cy="269" r="3" fill="#ef4444"/>                 <!-- 309 -->
  <circle cx="248" cy="231" r="3" fill="#ef4444"/>                 <!-- 321 -->
  <circle cx="248" cy="203" r="3" fill="#ef4444"/>                 <!-- 334 -->
  <circle cx="248" cy="180" r="3" fill="#ef4444"/>                 <!-- 347 -->

  <!-- Obstacle cluster near 2m, ~30 deg -->
  <circle cx="200" cy="129" r="3" fill="#ef4444"/>
  <circle cx="207" cy="122" r="3" fill="#ef4444"/>
  <circle cx="199" cy="117" r="3" fill="#ef4444"/>
  <circle cx="193" cy="125" r="3" fill="#ef4444"/>
  <text x="214" y="120" fill="#94a3b8" font-size="9" font-style="italic">obstacle</text>
</svg>
